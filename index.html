<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>LCARS Tactical Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --lcars-orange: #ff9900;
      --lcars-amber: #ffaa00;
      --lcars-gold: #ffcc00;
      --lcars-purple: #cc99cc;
      --lcars-blue: #99ccff;
      --lcars-red: #cc6666;
      --lcars-dark-red: #990000;
      --lcars-dark-blue: #0044aa;
      --lcars-slate: #556677;
      --lcars-panel: rgba(10, 14, 23, 0.9);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #030712;
      color: #ffffff;
      font-family: 'Antonio', -apple-system, sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #space-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    #app-container {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100%;
      height: 100dvh;
      padding: 0.4rem 0.6rem 0.5rem 0.6rem;
      gap: 0.35rem;
      z-index: 10;
    }

    header {
      width: 100%;
      height: 42px;
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 50;
    }

    .lcars-elbow-top {
      width: 100px;
      height: 42px;
      background: var(--lcars-orange);
      border-top-left-radius: 21px;
      border-bottom-left-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      color: #000;
      flex-shrink: 0;
      box-shadow: 0 0 14px rgba(255, 153, 0, 0.45);
    }

    .lcars-pill-bar {
      flex: 1;
      height: 42px;
      background: var(--lcars-purple);
      display: flex;
      align-items: center;
      padding: 0 0.85rem;
      color: #000;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 1.5px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      box-shadow: 0 0 14px rgba(204, 153, 204, 0.35);
    }

    .header-actions {
      display: flex;
      gap: 6px;
      height: 42px;
    }

    .lcars-btn {
      height: 42px;
      padding: 0 1rem;
      font-family: 'Antonio', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: filter 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lcars-btn:hover {
      filter: brightness(1.25);
    }

    .btn-phase {
      background: var(--lcars-amber);
      border-radius: 0;
      box-shadow: 0 0 10px rgba(255, 170, 0, 0.35);
    }

    .btn-refresh {
      background: var(--lcars-blue);
      border-top-right-radius: 21px;
      border-bottom-right-radius: 21px;
      padding-right: 1.25rem;
      box-shadow: 0 0 10px rgba(153, 204, 255, 0.35);
    }

    #theater-layout {
      display: flex;
      flex: 1;
      width: 100%;
      height: calc(100dvh - 54px);
      gap: 0.4rem;
      position: relative;
      overflow: hidden;
    }

    /* Left LCARS Side Rail */
    .lcars-side-rail {
      width: 58px;
      min-width: 58px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .rail-block-top {
      height: 30px;
      background: var(--lcars-orange);
      border-bottom-left-radius: 12px;
    }

    .rail-btn {
      height: 52px;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Antonio', sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      color: #000;
      letter-spacing: 1px;
      padding: 2px;
      transition: filter 0.15s ease;
    }

    .rail-btn:hover {
      filter: brightness(1.3);
    }

    .rail-btn-rp {
      background: var(--lcars-gold);
    }

    .rail-btn-settings {
      background: var(--lcars-blue);
    }

    .rail-block-mid {
      flex: 1;
      background: var(--lcars-purple);
      opacity: 0.85;
    }

    .rail-block-bottom {
      height: 50px;
      background: var(--lcars-amber);
      border-top-left-radius: 12px;
      border-bottom-left-radius: 12px;
    }

    #map-wrapper {
      position: relative;
      flex: 1;
      height: 100%;
      background: rgba(3, 7, 18, 0.6);
      backdrop-filter: blur(4px);
      border: 2px solid rgba(85, 102, 119, 0.65);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      touch-action: none;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.95), 0 0 24px rgba(15, 23, 42, 0.8);
    }

    #stage-container {
      position: relative;
      width: auto;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 2 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      will-change: transform;
      cursor: grab;
    }

    #stage-container:active {
      cursor: grabbing;
    }

    #campaign-map {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.95));
      pointer-events: none;
    }

    #overlay-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* On-Screen LCARS Pan & Zoom Map Controls */
    .map-controls {
      position: absolute;
      bottom: 10px;
      left: 10px;
      display: flex;
      gap: 6px;
      z-index: 35;
      pointer-events: auto;
    }

    .map-ctrl-btn {
      width: 34px;
      height: 34px;
      background: rgba(15, 23, 42, 0.88);
      border: 1.5px solid var(--lcars-amber);
      color: var(--lcars-amber);
      font-family: 'Antonio', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
      transition: all 0.15s ease;
    }

    .map-ctrl-btn:hover, .map-ctrl-btn:active {
      background: var(--lcars-amber);
      color: #000;
    }

    .map-ctrl-btn.btn-fit {
      width: 44px;
      font-size: 0.8rem;
      border-color: var(--lcars-blue);
      color: var(--lcars-blue);
    }

    .map-ctrl-btn.btn-fit:hover, .map-ctrl-btn.btn-fit:active {
      background: var(--lcars-blue);
      color: #000;
    }

    .sector-number-badge {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      padding: 3px 6px;
      border-radius: 7px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 0 0 5px currentColor;
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
      z-index: 10;
      letter-spacing: 0.5px;
    }

    .sector-number-badge:hover {
      transform: translate(-50%, -50%) scale(1.3);
      filter: brightness(1.3);
      z-index: 25;
    }

    .fleet-token-pill {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.95);
      transition: transform 0.15s ease;
      z-index: 15;
      letter-spacing: 1px;
    }

    .fleet-token-pill:hover {
      transform: translate(-50%, -50%) scale(1.18);
      z-index: 30;
      filter: brightness(1.25);
    }

    .fleet-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 6px #ffffff;
    }

    .fleet-locked-indicator {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
      margin-left: 2px;
    }

    #sidebar-panel {
      width: 320px;
      min-width: 320px;
      height: 100%;
      background: rgba(3, 7, 18, 0.96);
      backdrop-filter: blur(8px);
      border: 2px solid var(--lcars-orange);
      border-radius: 0 16px 16px 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 0.85rem;
      gap: 0.5rem;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.95);
      transition: border-color 0.25s ease;
    }

    #sidebar-panel.hidden {
      display: none;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--lcars-orange);
      color: #000;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 700;
      transition: background 0.25s ease;
    }

    .sidebar-title {
      font-size: 1.1rem;
      letter-spacing: 1.5px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #000;
      font-size: 1.4rem;
      font-weight: 700;
      cursor: pointer;
      line-height: 1;
      font-family: 'Antonio', sans-serif;
    }

    .sidebar-field-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.4rem;
    }

    .sidebar-field {
      background: var(--lcars-panel);
      padding: 0.45rem 0.65rem;
      border-left: 5px solid var(--lcars-purple);
      border-radius: 0 4px 4px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: border-left-color 0.25s ease;
    }

    .field-label {
      font-size: 0.72rem;
      color: var(--lcars-amber);
      font-weight: 700;
      letter-spacing: 1px;
    }

    .field-value {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      margin-top: 1px;
    }

    .sidebar-notes {
      background: var(--lcars-panel);
      padding: 0.65rem;
      border-left: 5px solid var(--lcars-gold);
      border-radius: 0 4px 4px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.9rem;
      color: #e2e8f0;
      line-height: 1.35;
      transition: border-left-color 0.25s ease;
    }

    .order-box {
      margin-top: 0.5rem;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--lcars-amber);
      border-radius: 4px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .order-classified-box {
      background: #022c22;
      border: 1px solid #22c55e;
      border-radius: 4px;
      padding: 0.75rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .order-classified-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #4ade80;
      letter-spacing: 1px;
    }

    .order-classified-text {
      font-size: 0.78rem;
      color: #86efac;
      letter-spacing: 0.5px;
    }

    .order-select {
      width: 100%;
      background: #000;
      color: #ffaa00;
      border: 1px solid #ff9900;
      padding: 0.45rem;
      font-family: 'Antonio', sans-serif;
      font-size: 0.95rem;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .order-input {
      width: 100%;
      background: #000;
      color: #ffffff;
      border: 1px solid var(--lcars-slate);
      padding: 0.45rem;
      font-family: 'Antonio', sans-serif;
      font-size: 1rem;
      border-radius: 4px;
      letter-spacing: 2px;
    }

    .order-input:focus {
      outline: none;
      border-color: var(--lcars-gold);
    }

    .btn-submit-order {
      background: var(--lcars-gold);
      color: #000;
      border: none;
      padding: 0.5rem;
      font-family: 'Antonio', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 4px;
      letter-spacing: 1px;
      transition: filter 0.15s ease;
    }

    .btn-submit-order:hover {
      filter: brightness(1.2);
    }

    .btn-modify-order {
      background: #334155;
      color: #cbd5e1;
      border: 1px solid #475569;
      padding: 0.45rem;
      font-family: 'Antonio', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 4px;
      letter-spacing: 1px;
      transition: background 0.15s ease;
    }

    .btn-modify-order:hover {
      background: #475569;
      color: #ffffff;
    }

    .combat-action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 0.5rem;
    }

    .btn-combat-retreat {
      background: var(--lcars-blue);
      color: #000;
      border: none;
      padding: 0.45rem;
      font-family: 'Antonio', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 4px;
    }

    .btn-combat-destroy {
      background: var(--lcars-dark-red);
      color: #fff;
      border: 1px solid var(--lcars-red);
      padding: 0.45rem;
      font-family: 'Antonio', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 4px;
    }

    .btn-combat-bonus {
      grid-column: span 2;
      background: var(--lcars-gold);
      color: #000;
      border: none;
      padding: 0.45rem;
      font-family: 'Antonio', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 4px;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    /* Fixed Landscape Blocker Overlay */
    #landscape-prompt {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: rgba(3, 7, 18, 0.98);
      backdrop-filter: blur(8px);
      z-index: 99999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
      user-select: none;
    }

    #landscape-prompt svg {
      width: 64px;
      height: 64px;
      fill: var(--lcars-orange);
      margin-bottom: 1.25rem;
      animation: rotateDevice 2s infinite ease-in-out;
    }

    @keyframes rotateDevice {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }

    /* Responsive Orientation Gate: Triggers whenever height exceeds width */
    @media (orientation: portrait), (max-aspect-ratio: 1/1) {
      #landscape-prompt {
        display: flex !important;
      }
    }

    @media screen and (max-width: 900px) {
      #sidebar-panel {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 290px;
        min-width: 290px;
        box-shadow: -8px 0 28px rgba(0,0,0,0.98);
        z-index: 45;
      }
      .lcars-side-rail {
        width: 48px;
        min-width: 48px;
      }
      .rail-btn {
        font-size: 0.72rem;
        height: 50px;
      }
    }
  </style>
</head>
<body>

  <canvas id="space-canvas"></canvas>

  <div id="landscape-prompt">
    <svg viewBox="0 0 24 24">
      <path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>
    </svg>
    <h3 style="color: #ff9900; margin-bottom: 0.5rem; font-size: 1.4rem;">ORIENTATION MISMATCH</h3>
    <p style="color: #99ccff; font-size: 1rem; max-width: 280px; line-height: 1.4;">
      ROTATE TERMINAL TO LANDSCAPE ORIENTATION FOR LCARS THEATER INTERFACE.
    </p>
  </div>

  <div id="app-container">
    <header>
      <div class="lcars-elbow-top">LCARS 47</div>
      <div id="phase-display" class="lcars-pill-bar">INITIALIZING TACTICAL STATUS...</div>
      <div class="header-actions">
        <button class="lcars-btn btn-phase" onclick="advancePhase()">CYCLE PHASE &raquo;</button>
        <button class="lcars-btn btn-refresh" onclick="fetchCampaignData()">SYNC</button>
      </div>
    </header>

    <div id="theater-layout">
      <!-- Left Side Rail with RP Treasury & Config -->
      <div class="lcars-side-rail">
        <div class="rail-block-top"></div>
        <button class="rail-btn rail-btn-rp" onclick="openRpLedgerMenu()" title="Open Confidential RP Treasury">
          <span>RP</span>
          <span style="font-size: 0.62rem; color: #1e293b;">TREASURY</span>
        </button>
        <button class="rail-btn rail-btn-settings" onclick="toggleSettingsMenu()" title="Open System Security & PIN Settings">
          <span>CONFIG</span>
          <span style="font-size: 0.62rem; color: #1e293b;">SECURITY</span>
        </button>
        <div class="rail-block-mid"></div>
        <div class="rail-block-bottom"></div>
      </div>

      <div id="map-wrapper">
        <div id="stage-container">
          <img id="campaign-map" src="map.png" alt="LCARS Campaign Map">
          <div id="overlay-layer"></div>
        </div>

        <!-- On-Screen LCARS Zoom & Fit Controls -->
        <div class="map-controls">
          <button class="map-ctrl-btn" onclick="zoomIn()" title="Zoom In">+</button>
          <button class="map-ctrl-btn" onclick="zoomOut()" title="Zoom Out">&minus;</button>
          <button class="map-ctrl-btn btn-fit" onclick="resetMap()" title="Fit Map to Screen">FIT</button>
        </div>
      </div>

      <aside id="sidebar-panel" class="hidden">
        <div id="sidebar-header" class="sidebar-header">
          <span id="sidebar-title" class="sidebar-title">TACTICAL DOSSIER</span>
          <button class="close-btn" onclick="closeSidebar()">&times;</button>
        </div>
        <div id="sidebar-content"></div>
      </aside>
    </div>
  </div>

  <script>
    (function initCosmos() {
      const canvas = document.getElementById('space-canvas');
      const ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        draw();
      }

      function draw() {
        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const g1 = ctx.createRadialGradient(canvas.width * 0.2, canvas.height * 0.3, 10, canvas.width * 0.2, canvas.height * 0.3, canvas.width * 0.45);
        g1.addColorStop(0, 'rgba(30, 58, 138, 0.4)');
        g1.addColorStop(1, 'transparent');
        ctx.fillStyle = g1;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const g2 = ctx.createRadialGradient(canvas.width * 0.8, canvas.height * 0.7, 10, canvas.width * 0.8, canvas.height * 0.7, canvas.width * 0.45);
        g2.addColorStop(0, 'rgba(88, 28, 135, 0.35)');
        g2.addColorStop(1, 'transparent');
        ctx.fillStyle = g2;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let seed = 42;
        function random() {
          const x = Math.sin(seed++) * 10000;
          return x - Math.floor(x);
        }

        const numStars = Math.floor((canvas.width * canvas.height) / 2400);
        for (let i = 0; i < numStars; i++) {
          const x = random() * canvas.width;
          const y = random() * canvas.height;
          const radius = random() * 1.5;
          const alpha = 0.3 + random() * 0.7;

          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fillStyle = (i % 7 === 0) ? `rgba(153, 204, 255, ${alpha})` : `rgba(255, 255, 255, ${alpha})`;
          ctx.fill();
        }
      }

      window.addEventListener('resize', resize);
      resize();
    })();

    const API_URL = "https://script.google.com/macros/s/AKfycby908UFG7N8UXnPCoswOY1HHMTv5n-D4Q10LSJO8zJYXJFH1f1XNR0w1tTteMRrB39QOA/exec";

    const PHASES = [
      "Phase I: Resource Gathering",
      "Phase II: The Operations Order",
      "Phase III: Tactical Resolution",
      "Phase IV: Attrition, Repairs & Expansion"
    ];

    let campaignData = null;
    const unlockedForEdit = {};

    function norm(str) {
      return String(str || '').trim().toLowerCase();
    }

    // Dynamic Orientation Checker (Fail-Safe for mobile viewport quirks)
    function enforceOrientation() {
      const promptEl = document.getElementById('landscape-prompt');
      if (!promptEl) return;
      const isPortrait = window.innerHeight > window.innerWidth;
      if (isPortrait) {
        promptEl.style.setProperty('display', 'flex', 'important');
      } else {
        promptEl.style.display = 'none';
      }
    }

    window.addEventListener('resize', enforceOrientation);
    window.addEventListener('orientationchange', enforceOrientation);
    window.addEventListener('DOMContentLoaded', enforceOrientation);

    async function hashPin(pin) {
      const msgUint8 = new TextEncoder().encode(String(pin).trim());
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function getPlayerRecord(name) {
      const list = (campaignData && campaignData.players) || [];
      const target = norm(name);
      return list.find(p => norm(p.player_name) === target);
    }

    function getPlayerColorTheme(name) {
      const rec = getPlayerRecord(name);
      if (rec && rec.color_bg && rec.color_border) {
        return {
          bg: rec.color_bg,
          border: rec.color_border,
          text: '#ffffff'
        };
      }

      const n = norm(name);
      if (!n || n.includes('neutral') || n === 'uncontrolled') {
        return { bg: '#223344', border: '#ffcc00', text: '#ffcc00' };
      }

      let hash = 0;
      for (let i = 0; i < n.length; i++) hash = n.charCodeAt(i) + ((hash << 5) - hash);
      const hue = Math.abs(hash) % 360;
      return {
        bg: `hsl(${hue}, 80%, 28%)`,
        border: `hsl(${hue}, 90%, 75%)`,
        text: '#ffffff'
      };
    }

    function formatLanes(val) {
      if (!val) return 'NONE';
      const str = String(val).trim();
      if (str.includes('T') && str.includes('-') && !isNaN(Date.parse(str))) {
        const d = new Date(str);
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        return `SEC ${day}, SEC ${month}`;
      }
      return str.replace(/-/g, ', ').replace(/SEC\s*/gi, 'SEC ');
    }

    function getSectorNeighbors(secId, sectors) {
      const targetSec = sectors.find(s => String(s.sector_id).padStart(2, '0') === secId);
      if (!targetSec) return [];

      let rawLanes = String(targetSec.connected_lanes || '').trim();
      if (rawLanes.includes('T') && rawLanes.includes('-') && !isNaN(Date.parse(rawLanes))) {
        const d = new Date(rawLanes);
        const d1 = String(d.getDate()).padStart(2, '0');
        const d2 = String(d.getMonth() + 1).padStart(2, '0');
        return [d1, d2];
      }

      const matches = rawLanes.match(/\b\d{1,2}\b/g) || [];
      return matches.map(m => String(m).padStart(2, '0')).filter(id => id !== secId);
    }

    function calculateLegalDestinations(currentSec, controllingPlayer, sectors) {
      const currentId = String(currentSec.sector_id).padStart(2, '0');
      const destinations = [];
      const pNorm = norm(controllingPlayer);

      destinations.push({
        id: currentId,
        dist: 0,
        label: `HOLD STATION (SEC ${currentId})`
      });

      const directNeighbors = getSectorNeighbors(currentId, sectors);
      directNeighbors.forEach(nbrId => {
        const nbrObj = sectors.find(s => String(s.sector_id).padStart(2, '0') === nbrId);
        const name = nbrObj ? (nbrObj.sector_name || `Sector ${nbrId}`) : `Sector ${nbrId}`;
        destinations.push({
          id: nbrId,
          dist: 1,
          label: `STANDARD TRANSIT: ${name} (${nbrId})`
        });
      });

      const startIsFriendly = (norm(currentSec.controller) === pNorm);

      if (startIsFriendly) {
        directNeighbors.forEach(step1Id => {
          const step1Sec = sectors.find(s => String(s.sector_id).padStart(2, '0') === step1Id);
          if (step1Sec && norm(step1Sec.controller) === pNorm) {
            const step2Neighbors = getSectorNeighbors(step1Id, sectors);

            step2Neighbors.forEach(step2Id => {
              const isNotOrigin = (step2Id !== currentId);
              const isNotDirectNeighbor = !directNeighbors.includes(step2Id);
              const notAlreadyListed = !destinations.some(d => d.id === step2Id);

              if (isNotOrigin && isNotDirectNeighbor && notAlreadyListed) {
                const step2Sec = sectors.find(s => String(s.sector_id).padStart(2, '0') === step2Id);
                if (step2Sec && norm(step2Sec.controller) === pNorm) {
                  const name = step2Sec.sector_name || `Sector ${step2Id}`;
                  destinations.push({
                    id: step2Id,
                    dist: 2,
                    label: `TACTICAL FLANK: ${name} (${step2Id} via Sector ${step1Id})`
                  });
                }
              }
            });
          }
        });
      }

      return destinations;
    }

    // --- INTERACTIVE MOBILE PAN & PINCH-ZOOM ENGINE ---
    let scale = 1.0;
    let panX = 0;
    let panY = 0;
    const stageEl = document.getElementById('stage-container');
    const mapWrapperEl = document.getElementById('map-wrapper');

    function applyMapTransform() {
      stageEl.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    function zoomIn() {
      scale = Math.min(3.5, scale + 0.25);
      applyMapTransform();
    }

    function zoomOut() {
      scale = Math.max(0.65, scale - 0.25);
      applyMapTransform();
    }

    function resetMap() {
      scale = 1.0;
      panX = 0;
      panY = 0;
      applyMapTransform();
    }

    // Touch Controls: One-finger Drag to Pan, Two-finger Pinch to Zoom
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartPanX = 0;
    let touchStartPanY = 0;
    let isTouching = false;
    let isPinching = false;
    let pinchStartDist = 0;
    let pinchStartScale = 1.0;

    mapWrapperEl.addEventListener('touchstart', (e) => {
      if (e.target.closest('.sector-number-badge, .fleet-token-pill, .map-ctrl-btn')) return;
      if (e.touches.length === 1) {
        isTouching = true;
        isPinching = false;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchStartPanX = panX;
        touchStartPanY = panY;
      } else if (e.touches.length === 2) {
        isTouching = false;
        isPinching = true;
        pinchStartDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        pinchStartScale = scale;
      }
    }, { passive: false });

    mapWrapperEl.addEventListener('touchmove', (e) => {
      if (e.target.closest('.sector-number-badge, .fleet-token-pill, .map-ctrl-btn')) return;
      if (isTouching && e.touches.length === 1) {
        e.preventDefault();
        panX = touchStartPanX + (e.touches[0].clientX - touchStartX);
        panY = touchStartPanY + (e.touches[0].clientY - touchStartY);
        applyMapTransform();
      } else if (isPinching && e.touches.length === 2) {
        e.preventDefault();
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (pinchStartDist > 0) {
          const factor = dist / pinchStartDist;
          scale = Math.min(3.5, Math.max(0.65, pinchStartScale * factor));
          applyMapTransform();
        }
      }
    }, { passive: false });

    mapWrapperEl.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        isTouching = false;
        isPinching = false;
      } else if (e.touches.length === 1) {
        isPinching = false;
        isTouching = true;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchStartPanX = panX;
        touchStartPanY = panY;
      }
    });

    // Mouse Drag & Wheel Zoom
    let isMouseDown = false;
    let mouseStartX = 0;
    let mouseStartY = 0;
    let mouseStartPanX = 0;
    let mouseStartPanY = 0;

    mapWrapperEl.addEventListener('mousedown', (e) => {
      if (e.target.closest('.sector-number-badge, .fleet-token-pill, .map-ctrl-btn')) return;
      isMouseDown = true;
      mouseStartX = e.clientX;
      mouseStartY = e.clientY;
      mouseStartPanX = panX;
      mouseStartPanY = panY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      panX = mouseStartPanX + (e.clientX - mouseStartX);
      panY = mouseStartPanY + (e.clientY - mouseStartY);
      applyMapTransform();
    });

    window.addEventListener('mouseup', () => {
      isMouseDown = false;
    });

    mapWrapperEl.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.15 : -0.15;
      scale = Math.min(3.5, Math.max(0.65, scale + delta));
      applyMapTransform();
    }, { passive: false });

    async function advancePhase() {
      const state = campaignData.campaignState || {};
      const currentPhase = state['Current Phase'] || PHASES[0];
      const isPhase3 = currentPhase.toLowerCase().includes("phase iii");

      if (isPhase3) {
        const fleets = campaignData.taskForces || [];
        const fleetsBySector = {};
        fleets.forEach(f => {
          const sId = String(f.sector_id).padStart(2, '0');
          if (!fleetsBySector[sId]) fleetsBySector[sId] = [];
          fleetsBySector[sId].push(f);
        });

        const contestedSectors = [];
        for (const [sId, fleetList] of Object.entries(fleetsBySector)) {
          const players = new Set(fleetList.map(f => norm(f.player)));
          if (players.size > 1) {
            const fleetNames = fleetList.map(f => `${f.task_force_id} (${f.player})`).join(', ');
            contestedSectors.push(`Sector ${sId}: ${fleetNames}`);
          }
        }

        if (contestedSectors.length > 0) {
          alert("TACTICAL ALERT: COMBAT UNRESOLVED!\n\nOpposing fleets cannot share space at the end of Tactical Resolution. Retreat or destroy defeated fleets before concluding Phase III:\n\n" + contestedSectors.join('\n'));
          return;
        }
      }

      const entry = prompt("SECURITY OVERRIDE: Enter Command Passcode to cycle phase:");
      if (entry === null || entry.trim() === '') return;

      const rawPass = entry.trim();
      const gmHash = await hashPin(rawPass);

      let nextIndex = PHASES.indexOf(currentPhase) + 1;
      if (nextIndex >= PHASES.length || nextIndex === -1) nextIndex = 0;
      const newPhase = PHASES[nextIndex];

      const phaseBar = document.getElementById('phase-display');
      const originalText = phaseBar.textContent;
      phaseBar.textContent = `AUTHENTICATING COMMAND OVERRIDE...`;

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ 
            action: 'update_phase', 
            newPhase: newPhase, 
            gmHash: gmHash, 
            rawPass: rawPass
          })
        });

        const respData = await res.json();
        
        if (respData.status === 'auth_failed') {
          alert("ACCESS DENIED: Invalid command passcode.");
          phaseBar.textContent = originalText;
          return;
        }

        if (respData.status === 'success') {
          for (const k in unlockedForEdit) delete unlockedForEdit[k];
          state['Current Phase'] = newPhase;
          phaseBar.textContent = newPhase;
          fetchCampaignData();
        } else {
          alert("SERVER ERROR: " + (respData.message || "Could not update phase."));
          phaseBar.textContent = originalText;
        }
      } catch (e) {
        console.error("Transmission error:", e);
        alert("COMMUNICATION ERROR: Unable to verify passcode with tactical server.");
        phaseBar.textContent = originalText;
      }
    }

      const title = document.getElementById('sidebar-title');
      const content = document.getElementById('sidebar-content');

      sidebar.style.borderColor = 'var(--lcars-blue)';
      header.style.background = 'var(--lcars-blue)';
      title.textContent = "SYSTEM CONFIGURATION";

      const playerOptions = (campaignData.players || []).map(p => {
        const isConfigured = p.has_pin_set ? "[PIN ACTIVE]" : "[PIN UNSET]";
        return `<option value="${p.player_name}">${p.player_name} ${isConfigured}</option>`;
      }).join('');

      content.innerHTML = `
        <div class="sidebar-notes" style="border-left-color: var(--lcars-blue); margin-bottom: 0.5rem;">
          <div class="field-label" style="color: var(--lcars-blue); margin-bottom: 2px;">SECURITY PROTOCOL</div>
          PASSCODES ARE ENCRYPTED BEFORE TRANSMISSION. ENTER NEW CODES BELOW TO UPDATE CREDENTIALS.
        </div>

        <div class="order-box" style="border-color: var(--lcars-blue);">
          <div class="field-label" style="color: var(--lcars-blue);">PLAYER PIN CONFIGURATION</div>
          <select id="settings-player-select" class="order-select" style="border-color: var(--lcars-blue); color: var(--lcars-blue);">
            ${playerOptions}
          </select>

          <div style="margin-top: 0.35rem;">
            <div class="field-label" style="color: var(--lcars-gold);">NEW SECRET PIN</div>
            <input id="settings-new-pin" type="password" maxlength="8" class="order-input" placeholder="ENTER NEW PIN">
          </div>

          <div style="margin-top: 0.35rem;">
            <div class="field-label" style="color: var(--lcars-gold);">CONFIRM NEW PIN</div>
            <input id="settings-confirm-pin" type="password" maxlength="8" class="order-input" placeholder="RE-ENTER NEW PIN">
          </div>

          <button id="btn-save-pin" class="btn-submit-order" style="background: var(--lcars-blue); color: #000; margin-top: 0.5rem;" onclick="executePinUpdate()">
            SAVE PLAYER PIN
          </button>
        </div>
      `;

      sidebar.classList.remove('hidden');
    }

    async function executePinUpdate() {
      const select = document.getElementById('settings-player-select');
      if (!select) return;

      const playerName = select.value;
      const newPinVal = document.getElementById('settings-new-pin').value;
      const confirmPinVal = document.getElementById('settings-confirm-pin').value;

      if (!newPinVal || newPinVal.trim() === '') {
        alert("INPUT ERROR: Please provide a new PIN.");
        return;
      }

      if (newPinVal !== confirmPinVal) {
        alert("SECURITY MISMATCH: The new PIN confirmation does not match.");
        return;
      }

      const btn = document.getElementById('btn-save-pin');
      btn.textContent = "ENCRYPTING & TRANSMITTING...";
      btn.disabled = true;

      const newPinHash = await hashPin(newPinVal);

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'set_pin',
            playerName: playerName,
            newPinHash: newPinHash
          })
        });

        alert(`SECURITY ENCRYPTED: PIN configured for ${playerName}.`);
        closeSidebar();
        setTimeout(fetchCampaignData, 1200);
      } catch (err) {
        alert("TRANSMISSION ERROR: " + err);
        btn.textContent = "SAVE PLAYER PIN";
        btn.disabled = false;
      }
    }

    async function submitSecretOrder(taskForceId, assignedPlayer) {
      const pRecord = getPlayerRecord(assignedPlayer);
      if (!pRecord) {
        alert(`CONFIGURATION ERROR: Player "${assignedPlayer}" is not defined in the Players tab.`);
        return;
      }

      const enteredPin = prompt(`TACTICAL AUTHENTICATION: Enter secret PIN for ${assignedPlayer}:`);
      if (enteredPin === null || enteredPin.trim() === '') return;
      const pinHash = await hashPin(enteredPin);

      const select = document.getElementById(`order-dest-${taskForceId}`);
      if (!select) return;

      const destSector = select.value;
      const btn = document.getElementById(`btn-order-${taskForceId}`);
      btn.textContent = "TRANSMITTING ENCRYPTED ORDER...";
      btn.disabled = true;

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'submit_order',
            taskForceId: taskForceId,
            playerName: assignedPlayer,
            pinHash: pinHash,
            destinationSectorId: destSector
          })
        });

        delete unlockedForEdit[taskForceId];
        const tf = (campaignData.taskForces || []).find(f => f.task_force_id === taskForceId);
        if (tf) tf.has_pending_order = true;

        const sec = (campaignData.sectors || []).find(s => String(s.sector_id).padStart(2, '0') === String(tf.sector_id).padStart(2, '0'));
        showFleetSidebar(tf, sec);
        renderMap();
      } catch (err) {
        alert("TRANSMISSION FAILURE: " + err);
        btn.textContent = "TRANSMIT ENCRYPTED ORDERS";
        btn.disabled = false;
      }
    }

    async function unlockOrderModification(taskForceId, assignedPlayer) {
      const enteredPin = prompt(`SECURITY CLEARANCE: Enter secret PIN for ${assignedPlayer} to modify orders:`);
      if (enteredPin === null || enteredPin.trim() === '') return;
      const pinHash = await hashPin(enteredPin);

      unlockedForEdit[taskForceId] = true;
      const tf = (campaignData.taskForces || []).find(f => f.task_force_id === taskForceId);
      if (tf) tf.has_pending_order = false;

      renderMap();

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'clear_order',
            taskForceId: taskForceId,
            playerName: assignedPlayer,
            pinHash: pinHash
          })
        });
      } catch (e) {
        console.error("Failed to clear backend order", e);
      }

      const sec = (campaignData.sectors || []).find(s => String(s.sector_id).padStart(2, '0') === String(tf.sector_id).padStart(2, '0'));
      showFleetSidebar(tf, sec);
    }

    function retreatFleet(taskForceId, assignedPlayer, rawSectorId) {
      const pass = prompt("GM COMMAND OVERRIDE: Enter passcode to authorize tactical retreat:");
      if (pass === null || pass.trim() === '') return;

      const pNorm = norm(assignedPlayer);
      const curId = String(rawSectorId).padStart(2, '0');
      const neighbors = getSectorNeighbors(curId, campaignData.sectors || []);

      if (neighbors.length === 0) {
        alert("TACTICAL ALERT: No connected hyperlanes found for Sector " + curId);
        return;
      }

      const optionsHtml = neighbors.map(nId => {
        const sObj = (campaignData.sectors || []).find(s => String(s.sector_id).padStart(2, '0') === nId);
        const name = sObj ? (sObj.sector_name || `Sector ${nId}`) : `Sector ${nId}`;
        const ctrl = sObj ? (sObj.controller || 'Neutral') : 'Unknown';
        const isFriendly = (norm(ctrl) === pNorm);
        return `<option value="${nId}">SEC ${nId}: ${name} [${ctrl.toUpperCase()}${isFriendly ? ' - FRIENDLY' : ''}]</option>`;
      }).join('');

      const existingBox = document.getElementById(`retreat-box-${taskForceId}`);
      if (existingBox) existingBox.remove();

      const container = document.getElementById('sidebar-content');
      const retreatBox = document.createElement('div');
      retreatBox.id = `retreat-box-${taskForceId}`;
      retreatBox.className = 'order-box';
      retreatBox.style.borderColor = 'var(--lcars-blue)';
      retreatBox.style.marginTop = '0.75rem';

      retreatBox.innerHTML = `
        <div class="field-label" style="color: var(--lcars-blue);">AUTHORIZATION GRANTED // SELECT RETREAT VECTOR</div>
        <select id="retreat-dest-${taskForceId}" class="order-select" style="border-color: var(--lcars-blue); color: var(--lcars-blue);">
          ${optionsHtml}
        </select>
        <button class="btn-submit-order" style="background: var(--lcars-blue); color: #000;" onclick="confirmRetreatExecution('${taskForceId}', '${pass.trim()}')">
          CONFIRM RETREAT VECTOR
        </button>
      `;

      container.appendChild(retreatBox);
    }

    async function confirmRetreatExecution(taskForceId, rawPass) {
      const select = document.getElementById(`retreat-dest-${taskForceId}`);
      if (!select) return;
      const retreatSec = select.value;
      const gmHash = await hashPin(rawPass);

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'retreat_fleet',
            taskForceId: taskForceId,
            retreatSectorId: retreatSec,
            gmHash: gmHash,
            rawPass: rawPass
          })
        });

        alert(`COMMAND LOG: ${taskForceId} retreated to Sector ${retreatSec}.`);
        closeSidebar();
        setTimeout(fetchCampaignData, 1200);
      } catch (err) {
        alert("COMMUNICATION ERROR: " + err);
      }
    }

    async function destroyFleet(taskForceId) {
      const pass = prompt("GM COMMAND OVERRIDE: Enter passcode to decommission/destroy fleet:");
      if (pass === null || pass.trim() === '') return;
      const rawPass = pass.trim();
      const gmHash = await hashPin(rawPass);

      const conf = confirm(`RED ALERT: Confirm destruction and removal of ${taskForceId} from the campaign roster?`);
      if (!conf) return;

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            action: 'destroy_fleet', 
            taskForceId: taskForceId, 
            gmHash: gmHash,
            rawPass: rawPass
          })
        });

        alert(`COMMAND LOG: ${taskForceId} decommissioned.`);
        closeSidebar();
        setTimeout(fetchCampaignData, 1200);
      } catch (err) {
        alert("COMMUNICATION ERROR: " + err);
      }
    }

    function renderMap() {
      const layer = document.getElementById('overlay-layer');
      layer.innerHTML = '';

      const sectors = campaignData.sectors || [];
      const fleets = campaignData.taskForces || [];

      const fleetsBySector = {};
      fleets.forEach(fleet => {
        const secId = String(fleet.sector_id).padStart(2, '0');
        if (!fleetsBySector[secId]) fleetsBySector[secId] = [];
        fleetsBySector[secId].push(fleet);
      });

      sectors.forEach(sec => {
        const secId = String(sec.sector_id).padStart(2, '0');
        let xPct = parseFloat(sec.x_pct);
        let yPct = parseFloat(sec.y_pct);
        
        if (secId === '01') xPct = 10.0;
        if (secId === '03') {
          xPct = 23.5;
          yPct = 60.0;
        }

        const theme = getPlayerColorTheme(sec.controller);

        const btn = document.createElement('div');
        btn.className = 'sector-number-badge';
        btn.style.left = `${xPct}%`;
        btn.style.top = `calc(${yPct}% - 12px)`;
        btn.style.background = theme.bg;
        btn.style.borderColor = theme.border;
        btn.style.color = theme.text;
        btn.textContent = secId;

        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          showSectorSidebar(sec);
        });

        layer.appendChild(btn);
      });

      sectors.forEach(sec => {
        const secId = String(sec.sector_id).padStart(2, '0');
        const stationFleets = fleetsBySector[secId] || [];

        let xPct = parseFloat(sec.x_pct);
        let yPct = parseFloat(sec.y_pct);
        if (secId === '01') xPct = 10.0;
        if (secId === '03') {
          xPct = 23.5;
          yPct = 60.0;
        }

        const verticalStepPx = 22;

        stationFleets.forEach((fleet, idx) => {
          const el = document.createElement('div');
          const verticalOffset = idx * verticalStepPx;

          el.className = 'fleet-token-pill';
          el.style.left = `${xPct}%`;
          el.style.top = `calc(${yPct}% + 14px + ${verticalOffset}px)`;

          const fleetTheme = getPlayerColorTheme(fleet.player);
          el.style.background = fleetTheme.bg;
          el.style.borderColor = fleetTheme.border;
          el.style.color = fleetTheme.text;
          el.style.borderWidth = '1.5px';
          el.style.borderStyle = 'solid';

          const hasLockedOrders = Boolean(fleet.has_pending_order) && !unlockedForEdit[fleet.task_force_id];
          const lockIndicator = hasLockedOrders ? `<span class="fleet-locked-indicator" title="Encrypted Orders On File"></span>` : '';

          el.innerHTML = `
            <span class="fleet-dot" style="background: ${fleetTheme.border};"></span>
            <span>${fleet.task_force_id}</span>
            ${lockIndicator}
          `;

          el.addEventListener('click', (e) => {
            e.stopPropagation();
            showFleetSidebar(fleet, sec);
          });

          layer.appendChild(el);
        });
      });
    }

    function showSectorSidebar(sec) {
      const sidebar = document.getElementById('sidebar-panel');
      const header = document.getElementById('sidebar-header');
      const secId = String(sec.sector_id).padStart(2, '0');
      const theme = getPlayerColorTheme(sec.controller);

      sidebar.style.borderColor = theme.border;
      header.style.background = theme.border;

      document.getElementById('sidebar-title').textContent = `SECTOR ${secId} DOSSIER`;

      document.getElementById('sidebar-content').innerHTML = `
        <div class="sidebar-field-grid">
          <div class="sidebar-field" style="border-left-color: ${theme.border};">
            <div class="field-label">DESIGNATION</div>
            <div class="field-value">${sec.sector_name}</div>
          </div>
          <div class="sidebar-field" style="border-left-color: ${theme.border};">
            <div class="field-label">TACTICAL CONTROL</div>
            <div class="field-value">${sec.controller || 'NEUTRAL SPACE'}</div>
          </div>
          <div class="sidebar-field" style="border-left-color: ${theme.border};">
            <div class="field-label">STELLAR CLASSIFICATION</div>
            <div class="field-value">${sec.classification || 'STANDARD'}</div>
          </div>
          <div class="sidebar-field" style="border-left-color: ${theme.border};">
            <div class="field-label">RESOURCE HARVEST</div>
            <div class="field-value">+${sec.rp_yield || '0'} RP / CYCLE</div>
          </div>
          <div class="sidebar-field" style="border-left-color: ${theme.border};">
            <div class="field-label">CONNECTED HYPERLANES</div>
            <div class="field-value">${formatLanes(sec.connected_lanes)}</div>
          </div>
        </div>
        <div class="sidebar-notes" style="margin-top: 0.5rem; border-left-color: ${theme.border};">
          <div class="field-label" style="color: ${theme.border}; margin-bottom: 2px;">TACTICAL ASSESSMENT</div>
          ${sec.notes || 'NO SPECIAL ANOMALIES RECORDED.'}
        </div>
      `;
      sidebar.classList.remove('hidden');
    }

    function showFleetSidebar(fleet, sec) {
      const sidebar = document.getElementById('sidebar-panel');
      const header = document.getElementById('sidebar-header');
      const fleetTheme = getPlayerColorTheme(fleet.player);

      sidebar.style.borderColor = fleetTheme.border;
      header.style.background = fleetTheme.border;

      document.getElementById('sidebar-title').textContent = `${fleet.task_force_id} LOG`;

      const currentPhase = String((campaignData.campaignState || {})['Current Phase'] || '');
      const isPhase2 = /\bphase ii\b/i.test(currentPhase);
      const isPhase3 = /\bphase iii\b/i.test(currentPhase);

      let ordersHtml = '';

      if (isPhase2) {
        const controllingPlayer = fleet.player || '';
        const isServerLocked = Boolean(fleet.has_pending_order);
        const isSessionUnlocked = Boolean(unlockedForEdit[fleet.task_force_id]);

        if (isServerLocked && !isSessionUnlocked) {
          ordersHtml = `
            <div class="order-box">
              <div class="order-classified-box">
                <div class="order-classified-title">&#128274; ORDERS TRANSMITTED & ENCRYPTED</div>
                <div class="order-classified-text">DESTINATION SEALED UNDER FOG OF WAR</div>
              </div>
              <button class="btn-modify-order" onclick="unlockOrderModification('${fleet.task_force_id}', '${controllingPlayer}')">
                CHANGE ORDERS (REQUIRES PIN)
              </button>
            </div>
          `;
        } else {
          const legalDestinations = calculateLegalDestinations(sec, controllingPlayer, campaignData.sectors);
          const optionsHtml = legalDestinations.map(d => {
            return `<option value="${d.id}">${d.label}</option>`;
          }).join('');

          ordersHtml = `
            <div class="order-box">
              <div class="field-label" style="color: var(--lcars-gold);">CONFIDENTIAL MOVEMENT DIRECTIVE</div>
              <select id="order-dest-${fleet.task_force_id}" class="order-select">
                ${optionsHtml}
              </select>
              <button id="btn-order-${fleet.task_force_id}" 
                      class="btn-submit-order" 
                      onclick="submitSecretOrder('${fleet.task_force_id}', '${controllingPlayer}')">
                TRANSMIT ENCRYPTED ORDERS
              </button>
            </div>
          `;
        }
      }

      let combatHtml = '';
      if (isPhase3) {
        combatHtml = `
          <div class="order-box" style="border-color: var(--lcars-red);">
            <div class="field-label" style="color: var(--lcars-red);">TACTICAL ENGAGEMENT STATUS</div>
            <div class="combat-action-grid">
              <button class="btn-combat-retreat" onclick="retreatFleet('${fleet.task_force_id}', '${fleet.player}', '${fleet.sector_id}')">
                RETREAT FLEET
              </button>
              <button class="btn-combat-destroy" onclick="destroyFleet('${fleet.task_force_id}')">
                DESTROY FLEET
              </button>
              <button class="btn-combat-bonus" onclick="awardBonusRpPrompt('${fleet.player}')">
                AWARD COMBAT BONUS RP
              </button>
            </div>
          </div>
        `;
      }

      document.getElementById('sidebar-content').innerHTML = `
        <div class="sidebar-field-grid">
          <div class="sidebar-field" style="border-left-color: ${fleetTheme.border};">
            <div class="field-label">ALLEGIANCE</div>
            <div class="field-value">${fleet.player || 'N/A'}</div>
          </div>
          <div class="sidebar-field" style="border-left-color: ${fleetTheme.border};">
            <div class="field-label">DEPLOYED SECTOR</div>
            <div class="field-value">${sec.sector_name} (SEC ${String(sec.sector_id).padStart(2, '0')})</div>
          </div>
        </div>
        ${ordersHtml}
        ${combatHtml}
      `;
      sidebar.classList.remove('hidden');
    }

    function closeSidebar() {
      document.getElementById('sidebar-panel').classList.add('hidden');
    }

    fetchCampaignData();
  </script>
</body>
</html>
