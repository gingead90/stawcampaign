<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Star Trek: Attack Wing - Sector War</title>
  <style>
    :root {
      --bg-color: #070a12;
      --card-bg: #111827;
      --panel-bg: #0f172a;
      --border-color: #1f2937;
      --text: #f3f4f6;
      --text-muted: #94a3b8;
      --accent-gold: #facc15;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden; /* Locks page to one viewport - zero page scrolling */
      background: var(--bg-color);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      padding: 0.5rem;
      gap: 0.5rem;
    }

    /* Compact Header */
    header {
      width: 100%;
      height: 48px;
      min-height: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 0 1rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      z-index: 50;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .status-badge {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #38bdf8;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .btn {
      padding: 0.35rem 0.75rem;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      transition: background 0.15s ease;
      white-space: nowrap;
    }

    .btn-phase { background: #d97706; color: #fff; }
    .btn-phase:hover { background: #b45309; }
    .btn-refresh { background: #2563eb; color: #fff; }
    .btn-refresh:hover { background: #1d4ed8; }

    /* Main Theater Layout (Map + Sidebar) */
    #theater-layout {
      display: flex;
      flex: 1;
      width: 100%;
      height: calc(100vh - 64px);
      gap: 0.5rem;
      position: relative;
      overflow: hidden;
    }

    /* Map Box auto-fits available viewport without dropping below fold */
    #map-wrapper {
      position: relative;
      flex: 1;
      height: 100%;
      background: #000;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    #stage-container {
      position: relative;
      max-width: 100%;
      max-height: 100%;
      display: inline-block;
      aspect-ratio: 2 / 1; /* Standard ratio matching campaign theater */
    }

    #campaign-map {
      display: block;
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 68px);
      object-fit: contain;
    }

    #overlay-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Sector Markers */
    .sector-number-badge {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
      padding: 3px 6px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);
      border: 1.5px solid transparent;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.95);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      z-index: 10;
    }

    .sector-number-badge:hover {
      transform: translate(-50%, -50%) scale(1.25);
      z-index: 25;
      box-shadow: 0 0 10px var(--accent-gold);
    }

    /* Fleet Tokens */
    .fleet-token-pill {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.85);
      transition: transform 0.15s ease;
      z-index: 15;
    }

    .fleet-token-pill:hover {
      transform: translate(-50%, -50%) scale(1.15);
      z-index: 30;
    }

    .fleet-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 3px #fff;
    }

    /* Right-Hand Tactical Sidebar */
    #sidebar-panel {
      width: 320px;
      min-width: 320px;
      height: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 1rem;
      transition: margin-right 0.25s ease, opacity 0.25s ease;
    }

    #sidebar-panel.hidden {
      display: none;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
      padding-bottom: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .sidebar-title {
      color: var(--accent-gold);
      font-size: 1rem;
      font-weight: 700;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.25rem;
      cursor: pointer;
      line-height: 1;
    }

    .close-btn:hover { color: #fff; }

    .sidebar-field-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .sidebar-field {
      background: var(--panel-bg);
      padding: 0.5rem 0.65rem;
      border-radius: 4px;
      border: 1px solid #1e293b;
    }

    .field-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .field-value {
      font-size: 0.9rem;
      font-weight: 600;
      color: #f1f5f9;
      margin-top: 2px;
    }

    .sidebar-notes {
      background: var(--panel-bg);
      padding: 0.65rem;
      border-radius: 4px;
      border-left: 3px solid var(--accent-gold);
      font-size: 0.8rem;
      color: #cbd5e1;
      line-height: 1.35;
    }

    /* Force Mobile Landscape Warning */
    #landscape-prompt {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.96);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
    }

    #landscape-prompt svg {
      width: 54px;
      height: 54px;
      fill: var(--accent-gold);
      margin-bottom: 1rem;
      animation: rotateDevice 2s infinite ease-in-out;
    }

    @keyframes rotateDevice {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }

    /* Show prompt on phones/tablets held in portrait mode */
    @media screen and (max-width: 899px) and (orientation: portrait) {
      #landscape-prompt {
        display: flex;
      }
    }

    /* On smaller landscape screens, float the sidebar over the map */
    @media screen and (max-width: 900px) {
      #sidebar-panel {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 270px;
        min-width: 270px;
        box-shadow: -5px 0 20px rgba(0,0,0,0.85);
        z-index: 40;
      }
    }
  </style>
</head>
<body>

  <!-- Forced Landscape Warning Overlay -->
  <div id="landscape-prompt">
    <svg viewBox="0 0 24 24">
      <path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>
    </svg>
    <h3 style="color: #facc15; margin-bottom: 0.5rem;">Rotate Device</h3>
    <p style="color: #cbd5e1; font-size: 0.9rem; max-width: 260px;">
      Sector War Theater Command requires <strong>Landscape Mode</strong>.
    </p>
  </div>

  <div id="app-container">
    <header>
      <div class="header-left">
        <span class="header-title">STAW: Sector War</span>
        <span id="phase-display" class="status-badge">Phase: Loading...</span>
      </div>
      <div class="header-actions">
        <button class="btn btn-phase" onclick="advancePhase()">Next Phase &raquo;</button>
        <button class="btn btn-refresh" onclick="fetchCampaignData()">Refresh</button>
      </div>
    </header>

    <div id="theater-layout">
      <!-- Sector Map Stage -->
      <div id="map-wrapper">
        <div id="stage-container">
          <img id="campaign-map" src="map.png" alt="Campaign Map">
          <div id="overlay-layer"></div>
        </div>
      </div>

      <!-- Right Tactical Sidebar -->
      <aside id="sidebar-panel" class="hidden">
        <div class="sidebar-header">
          <h3 id="sidebar-title" class="sidebar-title">Tactical Intel</h3>
          <button class="close-btn" onclick="closeSidebar()">&times;</button>
        </div>
        <div id="sidebar-content"></div>
      </aside>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycby908UFG7N8UXnPCoswOY1HHMTv5n-D4Q10LSJO8zJYXJFH1f1XNR0w1tTteMRrB39QOA/exec";

    const PHASES = [
      "Phase I: Resource Gathering",
      "Phase II: The Operations Order",
      "Phase III: Tactical Resolution",
      "Phase IV: Attrition, Repairs & Expansion"
    ];

    let campaignData = null;

    const KNOWN_COLORS = {
      'player a': { bg: 'rgba(30, 64, 175, 0.88)', border: '#60a5fa', text: '#ffffff' },
      'player b': { bg: 'rgba(185, 28, 28, 0.88)', border: '#f87171', text: '#ffffff' },
      'player c': { bg: 'rgba(21, 128, 61, 0.88)', border: '#4ade80', text: '#ffffff' },
      'player d': { bg: 'rgba(194, 65, 12, 0.88)', border: '#fb923c', text: '#ffffff' },
      'neutral':  { bg: 'rgba(30, 41, 59, 0.85)',  border: '#facc15', text: '#facc15' }
    };

    function getPlayerColorTheme(name) {
      if (!name) return KNOWN_COLORS['neutral'];
      const key = String(name).trim().toLowerCase();

      if (KNOWN_COLORS[key]) return KNOWN_COLORS[key];
      if (key.includes('neutral') || key === 'uncontrolled' || key === '') return KNOWN_COLORS['neutral'];
      if (key.includes('player a') || key.includes('federation')) return KNOWN_COLORS['player a'];
      if (key.includes('player b') || key.includes('klingon')) return KNOWN_COLORS['player b'];

      let hash = 0;
      for (let i = 0; i < key.length; i++) hash = key.charCodeAt(i) + ((hash << 5) - hash);
      const hue = Math.abs(hash) % 360;
      return {
        bg: `hsla(${hue}, 70%, 35%, 0.9)`,
        border: `hsl(${hue}, 80%, 70%)`,
        text: '#ffffff'
      };
    }

    async function fetchCampaignData() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        
        if (data.status === 'success') {
          campaignData = data;
          renderHeader();
          renderMap();
        }
      } catch (err) {
        console.error("Fetch failed", err);
      }
    }

    function renderHeader() {
      const state = campaignData.campaignState || {};
      const currentPhase = state['Current Phase'] || PHASES[0];
      document.getElementById('phase-display').textContent = currentPhase;
    }

    async function advancePhase() {
      const state = campaignData.campaignState || {};
      const currentPhase = state['Current Phase'] || PHASES[0];
      let nextIndex = PHASES.indexOf(currentPhase) + 1;
      if (nextIndex >= PHASES.length || nextIndex === -1) nextIndex = 0;

      const newPhase = PHASES[nextIndex];
      document.getElementById('phase-display').textContent = `${newPhase} (saving...)`;

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'update_phase', newPhase: newPhase })
        });
        state['Current Phase'] = newPhase;
        document.getElementById('phase-display').textContent = newPhase;
      } catch (e) {
        console.error("Failed to update phase", e);
        document.getElementById('phase-display').textContent = currentPhase;
      }
    }

    function renderMap() {
      const layer = document.getElementById('overlay-layer');
      layer.innerHTML = '';

      const sectors = campaignData.sectors || [];
      const fleets = campaignData.taskForces || [];

      const fleetsBySector = {};
      fleets.forEach(fleet => {
        const secId = String(fleet.sector_id).padStart(2, '0');
        if (!fleetsBySector[secId]) fleetsBySector[secId] = [];
        fleetsBySector[secId].push(fleet);
      });

      // Render Sector Markers
      sectors.forEach(sec => {
        const secId = String(sec.sector_id).padStart(2, '0');
        let xPct = parseFloat(sec.x_pct);
        let yPct = parseFloat(sec.y_pct);
        if (secId === '01') xPct = 10.0;

        const theme = getPlayerColorTheme(sec.controller);

        const btn = document.createElement('div');
        btn.className = 'sector-number-badge';
        btn.style.left = `${xPct}%`;
        btn.style.top = `calc(${yPct}% - 12px)`;
        btn.style.background = theme.bg;
        btn.style.borderColor = theme.border;
        btn.style.color = theme.text;
        btn.textContent = secId;

        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          showSectorSidebar(sec);
        });

        layer.appendChild(btn);
      });

      // Render Stacked Fleets
      sectors.forEach(sec => {
        const secId = String(sec.sector_id).padStart(2, '0');
        const stationFleets = fleetsBySector[secId] || [];

        let xPct = parseFloat(sec.x_pct);
        let yPct = parseFloat(sec.y_pct);
        if (secId === '01') xPct = 10.0;

        const verticalStepPx = 20;

        stationFleets.forEach((fleet, idx) => {
          const el = document.createElement('div');
          const verticalOffset = idx * verticalStepPx;

          el.className = 'fleet-token-pill';
          el.style.left = `${xPct}%`;
          el.style.top = `calc(${yPct}% + 14px + ${verticalOffset}px)`;

          const fleetTheme = getPlayerColorTheme(fleet.player || fleet.faction);
          el.style.background = fleetTheme.bg;
          el.style.borderColor = fleetTheme.border;
          el.style.color = fleetTheme.text;
          el.style.borderWidth = '1.5px';
          el.style.borderStyle = 'solid';

          el.innerHTML = `
            <span class="fleet-dot" style="background: ${fleetTheme.border};"></span>
            <span>${fleet.task_force_id}</span>
          `;

          el.addEventListener('click', (e) => {
            e.stopPropagation();
            showFleetSidebar(fleet, sec);
          });

          layer.appendChild(el);
        });
      });
    }

    function showSectorSidebar(sec) {
      const sidebar = document.getElementById('sidebar-panel');
      const secId = String(sec.sector_id).padStart(2, '0');
      document.getElementById('sidebar-title').textContent = `Sector ${secId}`;

      document.getElementById('sidebar-content').innerHTML = `
        <div class="sidebar-field-grid">
          <div class="sidebar-field">
            <div class="field-label">Name</div>
            <div class="field-value">${sec.sector_name}</div>
          </div>
          <div class="sidebar-field">
            <div class="field-label">Controller</div>
            <div class="field-value">${sec.controller || 'Neutral'}</div>
          </div>
          <div class="sidebar-field">
            <div class="field-label">Classification</div>
            <div class="field-value">${sec.classification || 'Standard'}</div>
          </div>
          <div class="sidebar-field">
            <div class="field-label">Resource Yield</div>
            <div class="field-value">+${sec.rp_yield || '0'} RP / turn</div>
          </div>
          <div class="sidebar-field">
            <div class="field-label">Connected Hyperlanes</div>
            <div class="field-value">${sec.connected_lanes || 'None'}</div>
          </div>
        </div>
        <div class="sidebar-notes">
          <strong>Strategic Trait:</strong><br>
          ${sec.notes || 'Standard operational space.'}
        </div>
      `;
      sidebar.classList.remove('hidden');
    }

    function showFleetSidebar(fleet, sec) {
      const sidebar = document.getElementById('sidebar-panel');
      document.getElementById('sidebar-title').textContent = `${fleet.task_force_id}`;

      document.getElementById('sidebar-content').innerHTML = `
        <div class="sidebar-field-grid">
          <div class="sidebar-field">
            <div class="field-label">Commanding Faction</div>
            <div class="field-value">${fleet.faction || 'N/A'}</div>
          </div>
          <div class="sidebar-field">
            <div class="field-label">Player Roster</div>
            <div class="field-value">${fleet.player || 'N/A'}</div>
          </div>
          <div class="sidebar-field">
            <div class="field-label">Stationed Sector</div>
            <div class="field-value">${sec.sector_name} (${String(sec.sector_id).padStart(2, '0')})</div>
          </div>
        </div>
      `;
      sidebar.classList.remove('hidden');
    }

    function closeSidebar() {
      document.getElementById('sidebar-panel').classList.add('hidden');
    }

    fetchCampaignData();
  </script>
</body>
</html>
