<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LCARS Tactical Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --lcars-orange: #ff9900;
      --lcars-amber: #ffaa00;
      --lcars-gold: #ffcc00;
      --lcars-purple: #cc99cc;
      --lcars-blue: #99ccff;
      --lcars-red: #cc6666;
      --lcars-dark-red: #990000;
      --lcars-dark-blue: #0044aa;
      --lcars-slate: #556677;
      --lcars-black: #000000;
      --lcars-panel: #0a0e17;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: var(--lcars-black);
      color: #ffffff;
      font-family: 'Antonio', -apple-system, sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      padding: 0.5rem 0.75rem 0.75rem 0.75rem;
      gap: 0.4rem;
    }

    /* LCARS Top Elbow & Banner */
    header {
      width: 100%;
      height: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 50;
    }

    .lcars-elbow-top {
      width: 110px;
      height: 44px;
      background: var(--lcars-orange);
      border-top-left-radius: 22px;
      border-bottom-left-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 12px;
      font-weight: 700;
      font-size: 1rem;
      color: var(--lcars-black);
      flex-shrink: 0;
    }

    .lcars-pill-bar {
      flex: 1;
      height: 44px;
      background: var(--lcars-purple);
      display: flex;
      align-items: center;
      padding: 0 1rem;
      color: var(--lcars-black);
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 1.5px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      height: 44px;
    }

    .lcars-btn {
      height: 44px;
      padding: 0 1.2rem;
      font-family: 'Antonio', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      color: var(--lcars-black);
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: opacity 0.15s ease, filter 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lcars-btn:hover {
      filter: brightness(1.2);
    }

    .btn-phase {
      background: var(--lcars-amber);
      border-radius: 0;
    }

    .btn-refresh {
      background: var(--lcars-blue);
      border-top-right-radius: 22px;
      border-bottom-right-radius: 22px;
      padding-right: 1.5rem;
    }

    /* Main Theater Layout */
    #theater-layout {
      display: flex;
      flex: 1;
      width: 100%;
      height: calc(100vh - 60px);
      gap: 0.5rem;
      position: relative;
      overflow: hidden;
    }

    /* Left LCARS Decorative Frame Rail */
    .lcars-side-rail {
      width: 42px;
      min-width: 42px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .rail-block-top {
      height: 40px;
      background: var(--lcars-orange);
      border-bottom-left-radius: 14px;
    }

    .rail-block-mid {
      flex: 1;
      background: var(--lcars-purple);
      opacity: 0.85;
    }

    .rail-block-bottom {
      height: 70px;
      background: var(--lcars-amber);
      border-top-left-radius: 14px;
      border-bottom-left-radius: 14px;
    }

    /* Map Box Stage */
    #map-wrapper {
      position: relative;
      flex: 1;
      height: 100%;
      background: #000;
      border: 2px solid var(--lcars-slate);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    #stage-container {
      position: relative;
      max-width: 100%;
      max-height: 100%;
      display: inline-block;
      aspect-ratio: 2 / 1;
    }

    #campaign-map {
      display: block;
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 66px);
      object-fit: contain;
    }

    #overlay-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* LCARS Sector Number Badges */
    .sector-number-badge {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      padding: 3px 6px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
      z-index: 10;
      letter-spacing: 0.5px;
    }

    .sector-number-badge:hover {
      transform: translate(-50%, -50%) scale(1.3);
      filter: brightness(1.3);
      z-index: 25;
    }

    /* LCARS Fleet Badges */
    .fleet-token-pill {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
      transition: transform 0.15s ease;
      z-index: 15;
      letter-spacing: 1px;
    }

    .fleet-token-pill:hover {
      transform: translate(-50%, -50%) scale(1.18);
      z-index: 30;
      filter: brightness(1.25);
    }

    .fleet-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 4px #ffffff;
    }

    /* LCARS Tactical Sidebar (PADD / Terminal) */
    #sidebar-panel {
      width: 320px;
      min-width: 320px;
      height: 100%;
      background: var(--lcars-black);
      border: 2px solid var(--lcars-orange);
      border-radius: 0 16px 16px 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 0.85rem;
      gap: 0.5rem;
    }

    #sidebar-panel.hidden {
      display: none;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--lcars-orange);
      color: var(--lcars-black);
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 700;
    }

    .sidebar-title {
      font-size: 1.1rem;
      letter-spacing: 1.5px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--lcars-black);
      font-size: 1.4rem;
      font-weight: 700;
      cursor: pointer;
      line-height: 1;
      font-family: 'Antonio', sans-serif;
    }

    .sidebar-field-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.4rem;
    }

    .sidebar-field {
      background: var(--lcars-panel);
      padding: 0.45rem 0.65rem;
      border-left: 5px solid var(--lcars-purple);
      border-radius: 0 4px 4px 0;
    }

    .field-label {
      font-size: 0.72rem;
      color: var(--lcars-amber);
      font-weight: 700;
      letter-spacing: 1px;
    }

    .field-value {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      margin-top: 1px;
    }

    .sidebar-notes {
      background: var(--lcars-panel);
      padding: 0.65rem;
      border-left: 5px solid var(--lcars-gold);
      border-radius: 0 4px 4px 0;
      font-size: 0.9rem;
      color: #e2e8f0;
      line-height: 1.35;
    }

    /* Force Mobile Landscape Warning */
    #landscape-prompt {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.98);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
    }

    #landscape-prompt svg {
      width: 58px;
      height: 58px;
      fill: var(--lcars-orange);
      margin-bottom: 1rem;
      animation: rotateDevice 2s infinite ease-in-out;
    }

    @keyframes rotateDevice {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }

    @media screen and (max-width: 899px) and (orientation: portrait) {
      #landscape-prompt { display: flex; }
    }

    @media screen and (max-width: 900px) {
      #sidebar-panel {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 280px;
        min-width: 280px;
        box-shadow: -6px 0 24px rgba(0,0,0,0.95);
        z-index: 40;
      }
      .lcars-side-rail { display: none; }
    }
  </style>
</head>
<body>

  <!-- Forced Landscape Warning Overlay -->
  <div id="landscape-prompt">
    <svg viewBox="0 0 24 24">
      <path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>
    </svg>
    <h3 style="color: #ff9900; margin-bottom: 0.5rem; font-size: 1.4rem;">ORIENTATION MISMATCH</h3>
    <p style="color: #99ccff; font-size: 1rem; max-width: 280px;">
      ROTATE TERMINAL TO LANDSCAPE ORIENTATION FOR LCARS THEATER INTERFACE.
    </p>
  </div>

  <div id="app-container">
    <!-- LCARS Header Frame -->
    <header>
      <div class="lcars-elbow-top">LCARS 47</div>
      <div id="phase-display" class="lcars-pill-bar">INITIALIZING TACTICAL STATUS...</div>
      <div class="header-actions">
        <button class="lcars-btn btn-phase" onclick="advancePhase()">CYCLE PHASE &raquo;</button>
        <button class="lcars-btn btn-refresh" onclick="fetchCampaignData()">SYNC</button>
      </div>
    </header>

    <div id="theater-layout">
      <!-- Decorative LCARS Side Spine -->
      <div class="lcars-side-rail">
        <div class="rail-block-top"></div>
        <div class="rail-block-mid"></div>
        <div class="rail-block-bottom"></div>
      </div>

      <!-- Main Sector Map Stage -->
      <div id="map-wrapper">
        <div id="stage-container">
          <img id="campaign-map" src="map.png" alt="LCARS Campaign Map">
          <div id="overlay-layer"></div>
        </div>
      </div>

      <!-- LCARS Tactical Readout Terminal -->
      <aside id="sidebar-panel" class="hidden">
        <div class="sidebar-header">
          <span id="sidebar-title" class="sidebar-title">TACTICAL DOSSIER</span>
          <button class="close-btn" onclick="closeSidebar()">&times;</button>
        </div>
        <div id="sidebar-content"></div>
      </aside>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycby908UFG7N8UXnPCoswOY1HHMTv5n-D4Q10LSJO8zJYXJFH1f1XNR0w1tTteMRrB39QOA/exec";

    const PHASES = [
      "Phase I: Resource Gathering",
      "Phase II: The Operations Order",
      "Phase III: Tactical Resolution",
      "Phase IV: Attrition, Repairs & Expansion"
    ];

    let campaignData = null;

    // Authentic LCARS Palette Mappings
    const KNOWN_COLORS = {
      'player a': { bg: '#0044aa', border: '#99ccff', text: '#ffffff' }, // Federation Blue
      'player b': { bg: '#990000', border: '#ff6666', text: '#ffffff' }, // Klingon Red
      'player c': { bg: '#006633', border: '#66ff99', text: '#ffffff' }, // Romulan Green
      'player d': { bg: '#cc6600', border: '#ffaa00', text: '#ffffff' }, // Cardassian Amber
      'neutral':  { bg: '#223344', border: '#ffcc00', text: '#ffcc00' }  // LCARS Dark/Gold
    };

    function getPlayerColorTheme(name) {
      if (!name) return KNOWN_COLORS['neutral'];
      const key = String(name).trim().toLowerCase();

      if (KNOWN_COLORS[key]) return KNOWN_COLORS[key];
      if (key.includes('neutral') || key === 'uncontrolled' || key === '') return KNOWN_COLORS['neutral'];
      if (key.includes('player a') || key.includes('federation')) return KNOWN_COLORS['player a'];
      if (key.includes('player b') || key.includes('klingon')) return KNOWN_COLORS['player b'];

      let hash = 0;
      for (let i = 0; i < key.length; i++) hash = key.charCodeAt(i) + ((hash << 5) - hash);
      const hue = Math.abs(hash) % 360;
      return {
        bg: `hsl(${hue}, 80%, 28%)`,
        border: `hsl(${hue}, 90%, 75%)`,
        text: '#ffffff'
      };
    }

    async function fetchCampaignData() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        
        if (data.status === 'success') {
          campaignData = data;
          renderHeader();
          renderMap();
        }
      } catch (err) {
        console.error("Fetch failed", err);
      }
    }

    function renderHeader() {
      const state = campaignData.campaignState || {};
      const currentPhase = state['Current Phase'] || PHASES[0];
      document.getElementById('phase-display').textContent = currentPhase;
    }

    async function advancePhase() {
      const state = campaignData.campaignState || {};
      const currentPhase = state['Current Phase'] || PHASES[0];
      let nextIndex = PHASES.indexOf(currentPhase) + 1;
      if (nextIndex >= PHASES.length || nextIndex === -1) nextIndex = 0;

      const newPhase = PHASES[nextIndex];
      document.getElementById('phase-display').textContent = `${newPhase} [UPDATING...]`;

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'update_phase', newPhase: newPhase })
        });
        state['Current Phase'] = newPhase;
        document.getElementById('phase-display').textContent = newPhase;
      } catch (e) {
        console.error("Failed to update phase", e);
        document.getElementById('phase-display').textContent = currentPhase;
      }
    }

    function renderMap() {
      const layer = document.getElementById('overlay-layer');
      layer.innerHTML = '';

      const sectors = campaignData.sectors || [];
      const fleets = campaignData.taskForces || [];

      const fleetsBySector = {};
      fleets.forEach(fleet => {
        const secId = String(fleet.sector_id).padStart(2, '0');
        if (!fleetsBySector[secId]) fleetsBySector[secId] = [];
        fleetsBySector[secId].push(fleet);
      });

      // Render LCARS Sector Badges
      sectors.forEach(sec => {
        const secId = String(sec.sector_id).padStart(2, '0');
        let xPct = parseFloat(sec.x_pct);
        let yPct = parseFloat(sec.y_pct);
        if (secId === '01') xPct = 10.0;

        const theme = getPlayerColorTheme(sec.controller);

        const btn = document.createElement('div');
        btn.className = 'sector-number-badge';
        btn.style.left = `${xPct}%`;
        btn.style.top = `calc(${yPct}% - 12px)`;
        btn.style.background = theme.bg;
        btn.style.borderColor = theme.border;
        btn.style.color = theme.text;
        btn.textContent = `SEC ${secId}`;

        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          showSectorSidebar(sec);
        });

        layer.appendChild(btn);
      });

      // Render LCARS Vertically Stacked Fleets
      sectors.forEach(sec => {
        const secId = String(sec.sector_id).padStart(2, '0');
        const stationFleets = fleetsBySector[secId] || [];

        let xPct = parseFloat(sec.x_pct);
        let yPct = parseFloat(sec.y_pct);
        if (secId === '01') xPct = 10.0;

        const verticalStepPx = 22;

        stationFleets.forEach((fleet, idx) => {
          const el = document.createElement('div');
          const verticalOffset = idx * verticalStepPx;

          el.className = 'fleet-token-pill';
          el.style.left = `${xPct}%`;
          el.style.top = `calc(${yPct}% + 14px + ${verticalOffset}px)`;

          const fleetTheme = getPlayerColorTheme(fleet.player || fleet.faction);
          el.style.background = fleetTheme.bg;
          el.style.borderColor = fleetTheme.border;
          el.style.color = fleetTheme.text;
          el.style.borderWidth = '1.5px';
          el.style.borderStyle = 'solid';

          el.innerHTML = `
            <span class="fleet-dot" style="background: ${fleetTheme.border};"></span>
            <span>${fleet.task_force_id}</span>
          `;

          el.addEventListener('click', (e) => {
            e.stopPropagation();
            showFleetSidebar(fleet, sec);
          });

          layer.appendChild(el);
        });
      });
    }

    function showSectorSidebar(sec) {
      const sidebar = document.getElementById('sidebar-panel');
      const secId = String(sec.sector_id).padStart(2, '0');
      document.getElementById('sidebar-title').textContent = `SECTOR ${secId} DOSSIER`;

      document.getElementById('sidebar-content').innerHTML = `
        <div class="sidebar-field-grid">
          <div class="sidebar-field">
            <div class="field-label">DESIGNATION</div>
            <div class="field-value">${sec.sector_name}</div>
          </div>
          <div class="sidebar-field">
            <div class="field-label">TACTICAL CONTROL</div>
            <div class="field-value">${sec.controller || 'NEUTRAL SPACE'}</div>
          </div>
          <div class="sidebar-field">
            <div class="field-label">STELLAR CLASSIFICATION</div>
            <div class="field-value">${sec.classification || 'STANDARD'}</div>
          </div>
          <div class="sidebar-field">
            <div class="field-label">RESOURCE HARVEST</div>
            <div class="field-value">+${sec.rp_yield || '0'} RP / CYCLE</div>
          </div>
          <div class="sidebar-field">
            <div class="field-label">CONNECTED HYPERLANES</div>
            <div class="field-value">${sec.connected_lanes || 'NONE'}</div>
          </div>
        </div>
        <div class="sidebar-notes" style="margin-top: 0.5rem;">
          <div class="field-label" style="color: var(--lcars-gold); margin-bottom: 2px;">TACTICAL ASSESSMENT</div>
          ${sec.notes || 'NO SPECIAL ANOMALIES RECORDED.'}
        </div>
      `;
      sidebar.classList.remove('hidden');
    }

    function showFleetSidebar(fleet, sec) {
      const sidebar = document.getElementById('sidebar-panel');
      document.getElementById('sidebar-title').textContent = `${fleet.task_force_id} LOG`;

      document.getElementById('sidebar-content').innerHTML = `
        <div class="sidebar-field-grid">
          <div class="sidebar-field">
            <div class="field-label">COMMANDING POWER</div>
            <div class="field-value">${fleet.faction || 'N/A'}</div>
          </div>
          <div class="sidebar-field">
            <div class="field-label">OPERATOR</div>
            <div class="field-value">${fleet.player || 'N/A'}</div>
          </div>
          <div class="sidebar-field">
            <div class="field-label">DEPLOYED SECTOR</div>
            <div class="field-value">${sec.sector_name} (SEC ${String(sec.sector_id).padStart(2, '0')})</div>
          </div>
        </div>
      `;
      sidebar.classList.remove('hidden');
    }

    function closeSidebar() {
      document.getElementById('sidebar-panel').classList.add('hidden');
    }

    fetchCampaignData();
  </script>
</body>
</html>
