<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LCARS Tactical Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --lcars-orange: #ff9900;
      --lcars-amber: #ffaa00;
      --lcars-gold: #ffcc00;
      --lcars-purple: #cc99cc;
      --lcars-blue: #99ccff;
      --lcars-red: #cc6666;
      --lcars-dark-red: #990000;
      --lcars-dark-blue: #0044aa;
      --lcars-slate: #556677;
      --lcars-panel: rgba(10, 14, 23, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Deep Space Multi-Layered Starfield Background */
    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: #030611;
      background-image: 
        /* Subtle Nebula Clouds */
        radial-gradient(circle at 15% 25%, rgba(30, 58, 138, 0.35) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(88, 28, 135, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.4) 0%, transparent 60%),
        /* Dense Micro Stars */
        radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 40px 70px, rgba(255,255,255,0.7), rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 90px 40px, #99ccff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 160px 120px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 230px 190px, #ffccaa, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 290px 80px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 340px 240px, rgba(255,255,255,0.6), rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 410px 160px, #99ccff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 100% 100%, 100% 100%, 100% 100%, 350px 350px, 350px 350px, 350px 350px, 350px 350px, 350px 350px, 350px 350px, 350px 350px, 350px 350px;
      color: #ffffff;
      font-family: 'Antonio', -apple-system, sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      padding: 0.5rem 0.75rem 0.75rem 0.75rem;
      gap: 0.4rem;
    }

    header {
      width: 100%;
      height: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 50;
    }

    .lcars-elbow-top {
      width: 110px;
      height: 44px;
      background: var(--lcars-orange);
      border-top-left-radius: 22px;
      border-bottom-left-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 12px;
      font-weight: 700;
      font-size: 1rem;
      color: #000;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(255, 153, 0, 0.4);
    }

    .lcars-pill-bar {
      flex: 1;
      height: 44px;
      background: var(--lcars-purple);
      display: flex;
      align-items: center;
      padding: 0 1rem;
      color: #000;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 1.5px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      box-shadow: 0 0 12px rgba(204, 153, 204, 0.3);
    }

    .header-actions {
      display: flex;
      gap: 6px;
      height: 44px;
    }

    .lcars-btn {
      height: 44px;
      padding: 0 1.2rem;
      font-family: 'Antonio', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: opacity 0.15s ease, filter 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lcars-btn:hover {
      filter: brightness(1.2);
    }

    .btn-phase {
      background: var(--lcars-amber);
      border-radius: 0;
      box-shadow: 0 0 10px rgba(255, 170, 0, 0.35);
    }

    .btn-refresh {
      background: var(--lcars-blue);
      border-top-right-radius: 22px;
      border-bottom-right-radius: 22px;
      padding-right: 1.5rem;
      box-shadow: 0 0 10px rgba(153, 204, 255, 0.35);
    }

    #theater-layout {
      display: flex;
      flex: 1;
      width: 100%;
      height: calc(100vh - 60px);
      gap: 0.5rem;
      position: relative;
      overflow: hidden;
    }

    .lcars-side-rail {
      width: 42px;
      min-width: 42px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .rail-block-top {
      height: 40px;
      background: var(--lcars-orange);
      border-bottom-left-radius: 14px;
    }

    .rail-block-mid {
      flex: 1;
      background: var(--lcars-purple);
      opacity: 0.85;
    }

    .rail-block-bottom {
      height: 70px;
      background: var(--lcars-amber);
      border-top-left-radius: 14px;
      border-bottom-left-radius: 14px;
    }

    /* Map Box Stage Floating in Space */
    #map-wrapper {
      position: relative;
      flex: 1;
      height: 100%;
      background: radial-gradient(circle at center, rgba(11, 19, 43, 0.7) 0%, rgba(2, 6, 23, 0.95) 100%);
      border: 2px solid rgba(85, 102, 119, 0.55);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.9), 0 0 20px rgba(15, 23, 42, 0.8);
    }

    #stage-container {
      position: relative;
      max-width: 100%;
      max-height: 100%;
      display: inline-block;
      aspect-ratio: 2 / 1;
    }

    #campaign-map {
      display: block;
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 66px);
      object-fit: contain;
      filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.9));
    }

    #overlay-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .sector-number-badge {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      padding: 3px 6px;
      border-radius: 7px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 0 0 5px currentColor;
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
      z-index: 10;
      letter-spacing: 0.5px;
    }

    .sector-number-badge:hover {
      transform: translate(-50%, -50%) scale(1.3);
      filter: brightness(1.3);
      z-index: 25;
    }

    .fleet-token-pill {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.95);
      transition: transform 0.15s ease;
      z-index: 15;
      letter-spacing: 1px;
    }

    .fleet-token-pill:hover {
      transform: translate(-50%, -50%) scale(1.18);
      z-index: 30;
      filter: brightness(1.25);
    }

    .fleet-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 6px #ffffff;
    }

    /* LCARS Sidebar Translucent Against Space */
    #sidebar-panel {
      width: 320px;
      min-width: 320px;
      height: 100%;
      background: rgba(3, 7, 18, 0.88);
      backdrop-filter: blur(8px);
      border: 2px solid var(--lcars-orange);
      border-radius: 0 16px 16px 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 0.85rem;
      gap: 0.5rem;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
    }

    #sidebar-panel.hidden {
      display: none;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--lcars-orange);
      color: #000;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 700;
    }

    .sidebar-title {
      font-size: 1.1rem;
      letter-spacing: 1.5px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #000;
      font-size: 1.4rem;
      font-weight: 700;
      cursor: pointer;
      line-height: 1;
      font-family: 'Antonio', sans-serif;
    }

    .sidebar-field-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.4rem;
    }

    .sidebar-field {
      background: var(--lcars-panel);
      padding: 0.45rem 0.65rem;
      border-left: 5px solid var(--lcars-purple);
      border-radius: 0 4px 4px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .field-label {
      font-size: 0.72rem;
      color: var(--lcars-amber);
      font-weight: 700;
      letter-spacing: 1px;
    }

    .field-value {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      margin-top: 1px;
    }

    .sidebar-notes {
      background: var(--lcars-panel);
      padding: 0.65rem;
      border-left: 5px solid var(--lcars-gold);
      border-radius: 0 4px 4px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.9rem;
      color: #e2e8f0;
      line-height: 1.35;
    }

    #landscape-prompt {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.98);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
    }

    #landscape-prompt svg {
      width: 58px;
      height: 58px;
      fill: var(--lcars-orange);
      margin-bottom: 1rem;
      animation: rotateDevice 2s infinite ease-in-out;
    }

    @keyframes rotateDevice {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }

    @media screen and (max-width: 899px) and (orientation: portrait) {
      #landscape-prompt { display: flex; }
    }

    @media screen and (max-width: 900px) {
      #sidebar-panel {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 280px;
        min-width: 280px;
        box-shadow: -6px 0 24px rgba(0,0,0,0.95);
        z-index: 40;
      }
      .lcars-side-rail { display: none; }
    }
  </style>
</head>
<body>

  <div id="landscape-prompt">
    <svg viewBox="0 0 24 24">
      <path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>
    </svg>
    <h3 style="color: #ff9900; margin-bottom: 0.5rem; font-size: 1.4rem;">ORIENTATION MISMATCH</h3>
    <p style="color: #99ccff; font-size: 1rem; max-width: 280px;">
      ROTATE TERMINAL TO LANDSCAPE ORIENTATION FOR LCARS THEATER INTERFACE.
    </p>
  </div>

  <div id="app-container">
    <header>
      <div class="lcars-elbow-top">LCARS 47</div>
      <div id="phase-display" class="lcars-pill-bar">INITIALIZING TACTICAL STATUS...</div>
      <div class="header-actions">
        <button class="lcars-btn btn-phase" onclick="advancePhase()">CYCLE PHASE &raquo;</button>
        <button class="lcars-btn btn-refresh" onclick="fetchCampaignData()">SYNC</button>
      </div>
    </header>

    <div id="theater-layout">
      <div class="lcars-side-rail">
        <div class="rail-block-top"></div>
        <div class="rail-block-mid"></div>
        <div class="rail-block-bottom"></div>
      </div>

      <div id="map-wrapper">
        <div id="stage-container">
          <img id="campaign-map" src="map.png" alt="LCARS Campaign Map">
          <div id="overlay-layer"></div>
        </div>
      </div>

      <aside id="sidebar-panel" class="hidden">
        <div class="sidebar-header">
          <span id="sidebar-title" class="sidebar-title">TACTICAL DOSSIER</span>
          <button class="close-btn" onclick="closeSidebar()">&times;</button>
        </div>
        <div id="sidebar-content"></div>
      </aside>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycby908UFG7N8UXnPCoswOY1HHMTv5n-D4Q10LSJO8zJYXJFH1f1XNR0w1tTteMRrB39QOA/exec";

    const GM_PASSCODE = "1701";

    const PHASES = [
      "Phase I: Resource Gathering",
      "Phase II: The Operations Order",
      "Phase III: Tactical Resolution",
      "Phase IV: Attrition, Repairs & Expansion"
    ];

    let campaignData = null;

    const KNOWN_COLORS = {
      'player a': { bg: '#0044aa', border: '#99ccff', text: '#ffffff' },
      'player b': { bg: '#990000', border: '#ff6666', text: '#ffffff' },
      'player c': { bg: '#006633', border: '#66ff99', text: '#ffffff' },
      'player d': { bg: '#cc6600', border: '#ffaa00', text: '#ffffff' },
      'neutral':  { bg: '#223344', border: '#ffcc00', text: '#ffcc00' }
    };

    function getPlayerColorTheme(name) {
      if (!name) return KNOWN_COLORS['neutral'];
      const key = String(name).trim().toLowerCase();

      if (KNOWN_COLORS[key]) return KNOWN_COLORS[key];
      if (key.includes('neutral') || key === 'uncontrolled' || key === '') return KNOWN_COLORS['neutral'];
      if (key.includes('player a') || key.includes('federation')) return KNOWN_COLORS['player a'];
      if (key.includes('player b') || key.includes('klingon')) return KNOWN_COLORS['player b'];

      let hash = 0;
      for (let i = 0; i < key.length; i++) hash = key.charCodeAt(i) + ((hash << 5) - hash);
      const hue = Math.abs(hash) % 360;
      return {
        bg: `hsl(${hue}, 80%, 28%)`,
        border: `hsl(${hue}, 90%, 75%)`,
        text: '#ffffff'
      };
    }

    async function fetchCampaignData() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        
        if (data.status === 'success') {
          campaignData = data;
          renderHeader();
          renderMap();
        }
      } catch (err) {
        console.error("Fetch failed", err);
      }
    }

    function renderHeader() {
      const state = campaignData.campaignState || {};
      const currentPhase = state['Current Phase'] || PHASES[0];
      document.getElementById('phase-display').textContent = currentPhase;
    }

    async function advancePhase() {
      const entry = prompt("SECURITY OVERRIDE: Enter Command Passcode to cycle phase:");
      if (entry === null) return;
      if (entry.trim() !== GM_PASSCODE) {
        alert("ACCESS DENIED: Invalid command authorization.");
        return;
      }

      const state = campaignData.campaignState || {};
      const currentPhase = state['Current Phase'] || PHASES[0];
      let nextIndex = PHASES.indexOf(currentPhase) + 1;
      if (nextIndex >= PHASES.length || nextIndex === -1) nextIndex = 0;

      const newPhase
