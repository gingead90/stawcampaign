<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LCARS Tactical Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --lcars-orange: #ff9900;
      --lcars-amber: #ffaa00;
      --lcars-gold: #ffcc00;
      --lcars-purple: #cc99cc;
      --lcars-blue: #99ccff;
      --lcars-red: #cc6666;
      --lcars-dark-red: #990000;
      --lcars-dark-blue: #0044aa;
      --lcars-slate: #556677;
      --lcars-panel: rgba(10, 14, 23, 0.9);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: #030712;
      color: #ffffff;
      font-family: 'Antonio', -apple-system, sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #space-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    #app-container {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      padding: 0.5rem 0.75rem 0.75rem 0.75rem;
      gap: 0.4rem;
      z-index: 10;
    }

    header {
      width: 100%;
      height: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 50;
    }

    .lcars-elbow-top {
      width: 110px;
      height: 44px;
      background: var(--lcars-orange);
      border-top-left-radius: 22px;
      border-bottom-left-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 12px;
      font-weight: 700;
      font-size: 1rem;
      color: #000;
      flex-shrink: 0;
      box-shadow: 0 0 14px rgba(255, 153, 0, 0.45);
    }

    .lcars-pill-bar {
      flex: 1;
      height: 44px;
      background: var(--lcars-purple);
      display: flex;
      align-items: center;
      padding: 0 1rem;
      color: #000;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 1.5px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      box-shadow: 0 0 14px rgba(204, 153, 204, 0.35);
    }

    .header-actions {
      display: flex;
      gap: 6px;
      height: 44px;
    }

    .lcars-btn {
      height: 44px;
      padding: 0 1.2rem;
      font-family: 'Antonio', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: filter 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lcars-btn:hover {
      filter: brightness(1.25);
    }

    .btn-phase {
      background: var(--lcars-amber);
      border-radius: 0;
      box-shadow: 0 0 10px rgba(255, 170, 0, 0.35);
    }

    .btn-refresh {
      background: var(--lcars-blue);
      border-top-right-radius: 22px;
      border-bottom-right-radius: 22px;
      padding-right: 1.5rem;
      box-shadow: 0 0 10px rgba(153, 204, 255, 0.35);
    }

    #theater-layout {
      display: flex;
      flex: 1;
      width: 100%;
      height: calc(100vh - 60px);
      gap: 0.5rem;
      position: relative;
      overflow: hidden;
    }

    .lcars-side-rail {
      width: 42px;
      min-width: 42px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .rail-block-top {
      height: 40px;
      background: var(--lcars-orange);
      border-bottom-left-radius: 14px;
    }

    .rail-block-mid {
      flex: 1;
      background: var(--lcars-purple);
      opacity: 0.85;
    }

    .rail-block-bottom {
      height: 70px;
      background: var(--lcars-amber);
      border-top-left-radius: 14px;
      border-bottom-left-radius: 14px;
    }

    #map-wrapper {
      position: relative;
      flex: 1;
      height: 100%;
      background: rgba(3, 7, 18, 0.6);
      backdrop-filter: blur(4px);
      border: 2px solid rgba(85, 102, 119, 0.65);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.95), 0 0 24px rgba(15, 23, 42, 0.8);
    }

    #stage-container {
      position: relative;
      max-width: 100%;
      max-height: 100%;
      display: inline-block;
      aspect-ratio: 2 / 1;
    }

    #campaign-map {
      display: block;
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 66px);
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.95));
    }

    #overlay-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .sector-number-badge {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      padding: 3px 6px;
      border-radius: 7px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 0 0 5px currentColor;
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
      z-index: 10;
      letter-spacing: 0.5px;
    }

    .sector-number-badge:hover {
      transform: translate(-50%, -50%) scale(1.3);
      filter: brightness(1.3);
      z-index: 25;
    }

    .fleet-token-pill {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.95);
      transition: transform 0.15s ease;
      z-index: 15;
      letter-spacing: 1px;
    }

    .fleet-token-pill:hover {
      transform: translate(-50%, -50%) scale(1.18);
      z-index: 30;
      filter: brightness(1.25);
    }

    .fleet-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 6px #ffffff;
    }

    #sidebar-panel {
      width: 330px;
      min-width: 330px;
      height: 100%;
      background: rgba(3, 7, 18, 0.94);
      backdrop-filter: blur(8px);
      border: 2px solid var(--lcars-orange);
      border-radius: 0 16px 16px 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 0.85rem;
      gap: 0.5rem;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.95);
      transition: border-color 0.25s ease;
    }

    #sidebar-panel.hidden {
      display: none;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--lcars-orange);
      color: #000;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 700;
      transition: background 0.25s ease;
    }

    .sidebar-title {
      font-size: 1.1rem;
      letter-spacing: 1.5px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #000;
      font-size: 1.4rem;
      font-weight: 700;
      cursor: pointer;
      line-height: 1;
      font-family: 'Antonio', sans-serif;
    }

    .sidebar-field-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.4rem;
    }

    .sidebar-field {
      background: var(--lcars-panel);
      padding: 0.45rem 0.65rem;
      border-left: 5px solid var(--lcars-purple);
      border-radius: 0 4px 4px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: border-left-color 0.25s ease;
    }

    .field-label {
      font-size: 0.72rem;
      color: var(--lcars-amber);
      font-weight: 700;
      letter-spacing: 1px;
    }

    .field-value {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      margin-top: 1px;
    }

    .sidebar-notes {
      background: var(--lcars-panel);
      padding: 0.65rem;
      border-left: 5px solid var(--lcars-gold);
      border-radius: 0 4px 4px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.9rem;
      color: #e2e8f0;
      line-height: 1.35;
      transition: border-left-color 0.25s ease;
    }

    /* Secret Orders UI */
    .order-box {
      margin-top: 0.5rem;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--lcars-amber);
      border-radius: 4px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .order-select {
      width: 100%;
      background: #000;
      color: #ffaa00;
      border: 1px solid #ff9900;
      padding: 0.45rem;
      font-family: 'Antonio', sans-serif;
      font-size: 0.95rem;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .order-select:disabled {
      opacity: 0.65;
      border-color: #556677;
      color: #94a3b8;
    }

    .btn-submit-order {
      background: var(--lcars-gold);
      color: #000;
      border: none;
      padding: 0.5rem;
      font-family: 'Antonio', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 4px;
      letter-spacing: 1px;
      transition: filter 0.15s ease;
    }

    .btn-submit-order:hover {
      filter: brightness(1.2);
    }

    .btn-submit-order:disabled {
      cursor: not-allowed;
      filter: none;
    }

    .btn-modify-order {
      background: #334155;
      color: #94a3b8;
      border: 1px solid #475569;
      padding: 0.35rem;
      font-family: 'Antonio', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 4px;
      letter-spacing: 1px;
      transition: background 0.15s ease;
    }

    .btn-modify-order:hover {
      background: #475569;
      color: #ffffff;
    }

    #landscape-prompt {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.98);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
    }

    #landscape-prompt svg {
      width: 58px;
      height: 58px;
      fill: var(--lcars-orange);
      margin-bottom: 1rem;
      animation: rotateDevice 2s infinite ease-in-out;
    }

    @keyframes rotateDevice {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }

    @media screen and (max-width: 899px) and (orientation: portrait) {
      #landscape-prompt { display: flex; }
    }

    @media screen and (max-width: 900px) {
      #sidebar-panel {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 280px;
        min-width: 280px;
        box-shadow: -6px 0 24px rgba(0,0,0,0.95);
        z-index: 40;
      }
      .lcars-side-rail { display: none; }
    }
  </style>
</head>
<body>

  <canvas id="space-canvas"></canvas>

  <div id="landscape-prompt">
    <svg viewBox="0 0 24 24">
      <path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>
    </svg>
    <h3 style="color: #ff9900; margin-bottom: 0.5rem; font-size: 1.4rem;">ORIENTATION MISMATCH</h3>
    <p style="color: #99ccff; font-size: 1rem; max-width: 280px;">
      ROTATE TERMINAL TO LANDSCAPE ORIENTATION FOR LCARS THEATER INTERFACE.
    </p>
  </div>

  <div id="app-container">
    <header>
      <div class="lcars-elbow-top">LCARS 47</div>
      <div id="phase-display" class="lcars-pill-bar">INITIALIZING TACTICAL STATUS...</div>
      <div class="header-actions">
        <button class="lcars-btn btn-phase" onclick="advancePhase()">CYCLE PHASE &raquo;</button>
        <button class="lcars-btn btn-refresh" onclick="fetchCampaignData()">SYNC</button>
      </div>
    </header>

    <div id="theater-layout">
      <div class="lcars-side-rail">
        <div class="rail-block-top"></div>
        <div class="rail-block-mid"></div>
        <div class="rail-block-bottom"></div>
      </div>

      <div id="map-wrapper">
        <div id="stage-container">
          <img id="campaign-map" src="map.png" alt="LCARS Campaign Map">
          <div id="overlay-layer"></div>
        </div>
      </div>

      <aside id="sidebar-panel" class="hidden">
        <div id="sidebar-header" class="sidebar-header">
          <span id="sidebar-title" class="sidebar-title">TACTICAL DOSSIER</span>
          <button class="close-btn" onclick="closeSidebar()">&times;</button>
        </div>
        <div id="sidebar-content"></div>
      </aside>
    </div>
  </div>

  <script>
    (function initCosmos() {
      const canvas = document.getElementById('space-canvas');
      const ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        draw();
      }

      function draw() {
        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const g1 = ctx.createRadialGradient(canvas.width * 0.2, canvas.height * 0.3, 10, canvas.width * 0.2, canvas.height * 0.3, canvas.width * 0.45);
        g1.addColorStop(0, 'rgba(30, 58, 138, 0.4)');
        g1.addColorStop(1, 'transparent');
        ctx.fillStyle = g1;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const g2 = ctx.createRadialGradient(canvas.width * 0.8, canvas.height * 0.7, 10, canvas.width * 0.8, canvas.height * 0.7, canvas.width * 0.45);
        g2.addColorStop(0, 'rgba(88, 28, 135, 0.35)');
        g2.addColorStop(1, 'transparent');
        ctx.fillStyle = g2;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let seed = 42;
        function random() {
          const x = Math.sin(seed++) * 10000;
          return x - Math.floor(x);
        }

        const numStars = Math.floor((canvas.width * canvas.height) / 2400);
        for (let i = 0; i < numStars; i++) {
          const x = random() * canvas.width;
          const y = random() * canvas.height;
          const radius = random() * 1.5;
          const alpha = 0.3 + random() * 0.7;

          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fillStyle = (i % 7 === 0) ? `rgba(153, 204, 255, ${alpha})` : `rgba(255, 255, 255, ${alpha})`;
          ctx.fill();
        }
      }

      window.addEventListener('resize', resize);
      resize();
    })();

    const API_URL = "https://script.google.com/macros/s/AKfycby908UFG7N8UXnPCoswOY1HHMTv5n-D4Q10LSJO8zJYXJFH1f1XNR0w1tTteMRrB39QOA/exec";
    const GM_PASSCODE = "1701";

    const PHASES = [
      "Phase I: Resource Gathering",
      "Phase II: The Operations Order",
      "Phase III: Tactical Resolution",
      "Phase IV: Attrition, Repairs & Expansion"
    ];

    let campaignData = null;

    // Local lock state map for currently submitted fleet orders in Phase II
    const submittedOrders = {};

    function norm(str) {
      return String(str || '').trim().toLowerCase();
    }

    function getPlayerRecord(name) {
      const list = (campaignData && campaignData.players) || [];
      const target = norm(name);
      return list.find(p => norm(p.player_name) === target);
    }

    function getPlayerColorTheme(name) {
      const rec = getPlayerRecord(name);
      if (rec && rec.color_bg && rec.color_border) {
        return {
          bg: rec.color_bg,
          border: rec.color_border,
          text: '#ffffff'
        };
      }

      const n = norm(name);
      if (!n || n.includes('neutral') || n === 'uncontrolled') {
        return { bg: '#223344', border: '#ffcc00', text: '#ffcc00' };
      }

      let hash = 0;
      for (let i = 0; i < n.length; i++) hash = n.charCodeAt(i) + ((hash << 5) - hash);
      const hue = Math.abs(hash) % 360;
      return {
        bg: `hsl(${hue}, 80%, 28%)`,
        border: `hsl(${hue}, 90%, 75%)`,
        text: '#ffffff'
      };
    }

    function formatLanes(val) {
      if (!val) return 'NONE';
      const str = String(val).trim();
      if (str.includes('T') && str.includes('-') && !isNaN(Date.parse(str))) {
        const d = new Date(str);
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        return `SEC ${day}, SEC ${month}`;
      }
      return str.replace(/-/g, ', ').replace(/SEC\s*/gi, 'SEC ');
    }

    function getSectorNeighbors(secId, sectors) {
      const targetSec = sectors.find(s => String(s.sector_id).padStart(2, '0') === secId);
      if (!targetSec) return [];
      const matches = String(targetSec.connected_lanes || '').match(/\d+/g) || [];
      return matches.map(m => String(m).padStart(2, '0'));
    }

    // 1. Rule Enforcement: 1 hop anywhere; 2 hops ONLY if intermediate AND destination sectors are controlled by the player
    function calculateLegalDestinations(currentSec, controllingPlayer, sectors) {
      const currentId = String(currentSec.sector_id).padStart(2, '0');
      const destinations = [];

      destinations.push({
        id: currentId,
        dist: 0,
        label: `HOLD STATION (SEC ${currentId})`
      });

      // 1-Hop: Standard Transit to any adjacent hyperlane
      const directNeighbors = getSectorNeighbors(currentId, sectors);
      directNeighbors.forEach(nbrId => {
        const nbrObj = sectors.find(s => String(s.sector_id).padStart(2, '0') === nbrId);
        const name = nbrObj ? nbrObj.sector_name : `Sector ${nbrId}`;
        destinations.push({
          id: nbrId,
          dist: 1,
          label: `STANDARD TRANSIT: ${name} (${nbrId})`
        });
      });

      // 2-Hops: Tactical Flank ONLY if both intermediate (step1) AND destination (step2) are controlled by player
      directNeighbors.forEach(step1Id => {
        const step1Sec = sectors.find(s => String(s.sector_id).padStart(2, '0') === step1Id);
        if (step1Sec) {
          const isFriendlyStep1 = (norm(step1Sec.controller) === norm(controllingPlayer));
          if (isFriendlyStep1) {
            const step2Neighbors = getSectorNeighbors(step1Id, sectors);
            step2Neighbors.forEach(step2Id => {
              if (step2Id !== currentId && !destinations.some(d => d.id === step2Id)) {
                const step2Sec = sectors.find(s => String(s.sector_id).padStart(2, '0') === step2Id);
                if (step2Sec) {
                  const isFriendlyStep2 = (norm(step2Sec.controller) === norm(controllingPlayer));
                  // Destination must also be player controlled
                  if (isFriendlyStep2) {
                    const name = step2Sec.sector_name || `Sector ${step2Id}`;
                    destinations.push({
                      id: step2Id,
                      dist: 2,
                      label: `TACTICAL FLANK: ${name} (${step2Id} via Sector ${step1Id})`
                    });
                  }
                }
              }
            });
          }
        }
      });

      return destinations;
    }

    async function fetchCampaignData() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        
        if (data.status === 'success') {
          campaignData = data;
          renderHeader();
          renderMap();
        }
      } catch (err) {
        console.error("Fetch failed", err);
      }
    }

    function renderHeader() {
      const state = campaignData.campaignState || {};
      const currentPhase = state['Current Phase'] || PHASES[0];
      document.getElementById('phase-display').textContent = currentPhase;
    }

    async function advancePhase() {
      const entry = prompt("SECURITY OVERRIDE: Enter Command Passcode to cycle phase:");
      if (entry === null) return;
      if (entry.trim() !== GM_PASSCODE) {
        alert("ACCESS DENIED: Invalid command authorization.");
        return;
      }

      const state = campaignData.campaignState || {};
      const currentPhase = state['Current Phase'] || PHASES[0];
      let nextIndex = PHASES.indexOf(currentPhase) + 1;
      if (nextIndex >= PHASES.length || nextIndex === -1) nextIndex = 0;

      const newPhase = PHASES[nextIndex];
      document.getElementById('phase-display').textContent = `${newPhase} [UPDATING...]`;

      // Reset locked local orders when cycling to a new turn phase
      for (const k in submittedOrders) delete submittedOrders[k];

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'update_phase', newPhase: newPhase })
        });
        state['Current Phase'] = newPhase;
        document.getElementById('phase-display').textContent = newPhase;

        setTimeout(fetchCampaignData, 1200);
      } catch (e) {
        console.error("Failed to update phase", e);
        document.getElementById('phase-display').textContent = currentPhase;
      }
    }

    // 2. Submit Secret Order with PIN authentication and lock-out protection
    async function submitSecretOrder(taskForceId, assignedPlayer) {
      const playerRecord = getPlayerRecord(assignedPlayer);
      const expectedPin = (playerRecord && playerRecord.pin) ? String(playerRecord.pin).trim() : null;

      if (!expectedPin) {
        alert(`CONFIGURATION ERROR: Player "${assignedPlayer}" is not defined in the Players tab of your Google Sheet.`);
        return;
      }

      const enteredPin = prompt(`TACTICAL AUTHENTICATION: Enter security PIN for ${assignedPlayer}:`);
      if (enteredPin === null) return;
      if (enteredPin.trim() !== expectedPin) {
        alert("SECURITY BREACH: Incorrect player PIN. Order transmission aborted.");
        return;
      }

      const select = document.getElementById(`order-dest-${taskForceId}`);
      if (!select) return;

      const destSector = select.value;
      const btn = document.getElementById(`btn-order-${taskForceId}`);
      btn.textContent = "TRANSMITTING ENCRYPTED ORDER...";
      btn.disabled = true;

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'submit_order',
            taskForceId: taskForceId,
            destinationSectorId: destSector
          })
        });

        // Store locked state locally for this fleet
        submittedOrders[taskForceId] = destSector;

        // Lock controls
        select.disabled = true;
        btn.textContent = "ENCRYPTED ORDERS ON FILE [LOCKED]";
        btn.style.background = "#15803d";
        btn.style.color = "#ffffff";

        // Display Modify Orders option
        const modBtn = document.getElementById(`btn-mod-${taskForceId}`);
        if (modBtn) modBtn.style.display = "block";

      } catch (err) {
        alert("TRANSMISSION FAILURE: " + err);
        btn.textContent = "TRANSMIT ENCRYPTED ORDERS";
        btn.disabled = false;
      }
    }

    // Unlock submitted order using player PIN
    function unlockOrderModification(taskForceId, assignedPlayer) {
      const playerRecord = getPlayerRecord(assignedPlayer);
      const expectedPin = (playerRecord && playerRecord.pin) ? String(playerRecord.pin).trim() : null;

      const enteredPin = prompt(`SECURITY CLEARANCE: Enter PIN for ${assignedPlayer} to modify orders:`);
      if (enteredPin === null) return;
      if (enteredPin.trim() !== expectedPin) {
        alert("ACCESS DENIED: PIN incorrect.");
        return;
      }

      const select = document.getElementById(`order-dest-${taskForceId}`);
      const btn = document.getElementById(`btn-order-${taskForceId}`);
      const modBtn = document.getElementById(`btn-mod-${taskForceId}`);

      if (select) select.disabled = false;
      if (btn) {
        btn.disabled = false;
        btn.textContent = "TRANSMIT ENCRYPTED ORDERS";
        btn.style.background = "var(--lcars-gold)";
        btn.style.color = "#000000";
      }
      if (modBtn) modBtn.style.display = "none";
    }

    function renderMap() {
      const layer = document.getElementById('overlay-layer');
      layer.innerHTML = '';

      const sectors = campaignData.sectors || [];
      const fleets = campaignData.taskForces || [];

      const fleetsBySector = {};
      fleets.forEach(fleet => {
        const secId = String(fleet.sector_id).padStart(2, '0');
        if (!fleetsBySector[secId]) fleetsBySector[secId] = [];
        fleetsBySector[secId].push(fleet);
      });

      // Render Sector Badges
      sectors.forEach(sec => {
        const secId = String(sec.sector_id).padStart(2, '0');
        let xPct = parseFloat(sec.x_pct);
        let yPct = parseFloat(sec.y_pct);
        
        if (secId === '01') xPct = 10.0;
        if (secId === '03') {
          xPct = 23.5;
          yPct = 60.0;
        }

        const theme = getPlayerColorTheme(sec.controller);

        const btn = document.createElement('div');
        btn.className = 'sector-number-badge';
        btn.style.left = `${xPct}%`;
        btn.style.top = `calc(${yPct}% - 12px)`;
        btn.style.background = theme.bg;
        btn.style.borderColor = theme.border;
        btn.style.color = theme.text;
        btn.textContent = secId;

        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          showSectorSidebar(sec);
        });

        layer.appendChild(btn);
      });

      // Render Fleets
      sectors.forEach(sec => {
        const secId = String(sec.sector_id).padStart(2, '0');
        const stationFleets = fleetsBySector[secId] || [];

        let xPct = parseFloat(sec.x_pct);
        let yPct = parseFloat(sec.y_pct);
        if (secId === '01') xPct = 10.0;
        if (secId === '03') {
          xPct = 23.5;
          yPct = 60.0;
        }

        const verticalStepPx = 22;

        stationFleets.forEach((fleet, idx) => {
          const el = document.createElement('div');
          const verticalOffset = idx * verticalStepPx;

          el.className = 'fleet-token-pill';
          el.style.left = `${xPct}%`;
          el.style.top = `calc(${yPct}% + 14px + ${verticalOffset}px)`;

          const fleetTheme = getPlayerColorTheme(fleet.player);
          el.style.background = fleetTheme.bg;
          el.style.borderColor = fleetTheme.border;
          el.style.color = fleetTheme.text;
          el.style.borderWidth = '1.5px';
          el.style.borderStyle = 'solid';

          el.innerHTML = `
            <span class="fleet-dot" style="background: ${fleetTheme.border};"></span>
            <span>${fleet.task_force_id}</span>
          `;

          el.addEventListener('click', (e) => {
            e.stopPropagation();
            showFleetSidebar(fleet, sec);
          });

          layer.appendChild(el);
        });
      });
    }

    function showSectorSidebar(sec) {
      const sidebar = document.getElementById('sidebar-panel');
      const header = document.getElementById('sidebar-header');
      const secId = String(sec.sector_id).padStart(2, '0');
      const theme = getPlayerColorTheme(sec.controller);

      sidebar.style.borderColor = theme.border;
      header.style.background = theme.border;

      document.getElementById('sidebar-title').textContent = `SECTOR ${secId} DOSSIER`;

      document.getElementById('sidebar-content').innerHTML = `
        <div class="sidebar-field-grid">
          <div class="sidebar-field" style="border-left-color: ${theme.border};">
            <div class="field-label">DESIGNATION</div>
            <div class="field-value">${sec.sector_name}</div>
          </div>
          <div class="sidebar-field" style="border-left-color: ${theme.border};">
            <div class="field-label">TACTICAL CONTROL</div>
            <div class="field-value">${sec.controller || 'NEUTRAL SPACE'}</div>
          </div>
          <div class="sidebar-field" style="border-left-color: ${theme.border};">
            <div class="field-label">STELLAR CLASSIFICATION</div>
            <div class="field-value">${sec.classification || 'STANDARD'}</div>
          </div>
          <div class="sidebar-field" style="border-left-color: ${theme.border};">
            <div class="field-label">RESOURCE HARVEST</div>
            <div class="field-value">+${sec.rp_yield || '0'} RP / CYCLE</div>
          </div>
          <div class="sidebar-field" style="border-left-color: ${theme.border};">
            <div class="field-label">CONNECTED HYPERLANES</div>
            <div class="field-value">${formatLanes(sec.connected_lanes)}</div>
          </div>
        </div>
        <div class="sidebar-notes" style="margin-top: 0.5rem; border-left-color: ${theme.border};">
          <div class="field-label" style="color: ${theme.border}; margin-bottom: 2px;">TACTICAL ASSESSMENT</div>
          ${sec.notes || 'NO SPECIAL ANOMALIES RECORDED.'}
        </div>
      `;
      sidebar.classList.remove('hidden');
    }

    function showFleetSidebar(fleet, sec) {
      const sidebar = document.getElementById('sidebar-panel');
      const header = document.getElementById('sidebar-header');
      const fleetTheme = getPlayerColorTheme(fleet.player);

      sidebar.style.borderColor = fleetTheme.border;
      header.style.background = fleetTheme.border;

      document.getElementById('sidebar-title').textContent = `${fleet.task_force_id} LOG`;

      const currentPhase = (campaignData.campaignState || {})['Current Phase'] || '';
      const isPhase2 = currentPhase.includes("Phase II");

      let ordersHtml = '';
      if (isPhase2) {
        const controllingPlayer = fleet.player || '';
        const legalDestinations = calculateLegalDestinations(sec, controllingPlayer, campaignData.sectors);
        const isLocked = Boolean(submittedOrders[fleet.task_force_id]);
        const lockedDest = submittedOrders[fleet.task_force_id];
        
        const optionsHtml = legalDestinations.map(d => {
          const selected = (isLocked && d.id === lockedDest) ? 'selected' : '';
          return `<option value="${d.id}" ${selected}>${d.label}</option>`;
        }).join('');

        ordersHtml = `
          <div class="order-box">
            <div class="field-label" style="color: var(--lcars-gold);">CONFIDENTIAL MOVEMENT DIRECTIVE</div>
            <select id="order-dest-${fleet.task_force_id}" class="order-select" ${isLocked ? 'disabled' : ''}>
              ${optionsHtml}
            </select>
            <button id="btn-order-${fleet.task_force_id}" 
                    class="btn-submit-order" 
                    ${isLocked ? 'disabled style="background: #15803d; color: #fff;"' : ''} 
                    onclick="submitSecretOrder('${fleet.task_force_id}', '${controllingPlayer}')">
              ${isLocked ? 'ENCRYPTED ORDERS ON FILE [LOCKED]' : 'TRANSMIT ENCRYPTED ORDERS'}
            </button>
            <button id="btn-mod-${fleet.task_force_id}" 
                    class="btn-modify-order" 
                    style="${isLocked ? 'display:block;' : 'display:none;'}"
                    onclick="unlockOrderModification('${fleet.task_force_id}', '${controllingPlayer}')">
              MODIFY ORDERS (REQUIRES PIN)
            </button>
          </div>
        `;
      }

      document.getElementById('sidebar-content').innerHTML = `
        <div class="sidebar-field-grid">
          <div class="sidebar-field" style="border-left-color: ${fleetTheme.border};">
            <div class="field-label">ALLEGIANCE</div>
            <div class="field-value">${fleet.player || 'N/A'}</div>
          </div>
          <div class="sidebar-field" style="border-left-color: ${fleetTheme.border};">
            <div class="field-label">DEPLOYED SECTOR</div>
            <div class="field-value">${sec.sector_name} (SEC ${String(sec.sector_id).padStart(2, '0')})</div>
          </div>
        </div>
        ${ordersHtml}
      `;
      sidebar.classList.remove('hidden');
    }

    function closeSidebar() {
      document.getElementById('sidebar-panel').classList.add('hidden');
    }

    fetchCampaignData();
  </script>
</body>
</html>
